# Per-environment Flux Kustomizations for Companion.
#
# Today: only `companion-dev` is wired live (replaces the legacy
# `apps-companion` in apps.yaml when ready to cut over). The
# `companion-prod` definition is here as a template — uncomment +
# customize when the prod cluster comes online.
#
# Environment selection model:
#   - Dev cluster's Flux watches `main` branch.
#   - Prod cluster's Flux (when it exists) watches `prod-v*` tag pattern.
#
# A push to `main` cannot reach prod — prod's GitRepository ref is the
# tag pattern, not a branch. Promotion = `git tag -s prod-vN && git push --tags`.
#
# See docs/companion/ENVIRONMENT-STRATEGY.md for the full design.

---
# Dev environment — watches `main`, applies overlays/dev
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: companion-dev
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/companion/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: kube-world
  dependsOn:
    - name: apps-base
    - name: karmada-propagation-policies
  kubeConfig:
    secretRef:
      name: karmada-kubeconfig
      key: value

