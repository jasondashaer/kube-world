# Home Assistant configuration managed via GitOps.
# Mounted as /config/configuration.yaml via subPath (PVC holds .storage/ state).
# Changes here → git push → Flux syncs → Karmada propagates → pod restarts.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
data:
  configuration.yaml: |
    # Home identity and location — pre-configured to skip onboarding wizard.
    # Change these values and push to GitLab to update.
    homeassistant:
      name: "Home"
      latitude: 35.2271
      longitude: -80.8431
      elevation: 229
      unit_system: us_customary
      time_zone: "America/New_York"
      currency: "USD"
      country: "US"
      language: "en"
      external_url: "https://ha.edge1.kubew.dev"

    # Loads default set of integrations. Do not remove.
    default_config:

    # HTTP — reverse proxy support for Traefik
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16      # K3s pod CIDR
        - 10.43.0.0/16      # K3s service CIDR
        - 10.0.0.0/8        # LAN (covers any home network)
        - 100.64.0.0/10     # Tailscale CGNAT range
        - 127.0.0.1

    # Frontend themes
    frontend:
      themes: !include_dir_merge_named themes

    # SSO via native OIDC (hass-oidc-auth custom component)
    # Requires custom_components/auth_oidc/ installed on the PVC.
    auth_oidc:
      client_id: "HA_OIDC_CLIENT_ID"
      client_secret: "HA_OIDC_CLIENT_SECRET"
      discovery_url: "https://auth.DOMAIN/.well-known/openid-configuration"
      display_name: "Zitadel SSO"
      groups_scope: "urn:zitadel:iam:org:project:id:zitadel:aud"
      features:
        include_groups_scope: true
      # Zitadel's native role claim (urn:zitadel:iam:org:project:roles) is a nested
      # object, which hass-oidc-auth rejects ("Groups claim is not a list").
      # The seed's flattenRoles action emits a flat array into the "groups" claim
      # (id_token + userinfo) — read that instead.
      claims:
        groups: "groups"
      roles:
        admin: "admin"
        user: "user"
      network:
        tls_verify: true

    # Include files for automations, scripts, scenes
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # Tesla charge-port release — manual kill switch (ON = release allowed).
    # The actual safety lives in the script gates; this is a hard override.
    input_boolean:
      tesla_unlatch_enabled:
        name: "Tesla charge-port release enabled"
        icon: mdi:ev-plug-tesla
        initial: true
      tesla_unlock_doors_enabled:
        name: "Tesla door unlock enabled"
        icon: mdi:car-door
        initial: true

    # Dedicated YAML dashboard for the Tesla charge-cable button. Keeps the
    # default storage-mode dashboards untouched and adds a "Tesla" sidebar item.
    lovelace:
      mode: storage
      dashboards:
        # User-facing: single release button. No require_admin → all logged-in
        # users see it.
        tesla-charge:
          mode: yaml
          title: Tesla
          icon: mdi:ev-plug-tesla
          show_in_sidebar: true
          filename: tesla-dashboard.yaml
        # Admin-only: full controls + status card. require_admin hides it from
        # non-admin (kube-world-users) accounts entirely.
        tesla-admin:
          mode: yaml
          title: Tesla (Admin)
          icon: mdi:ev-plug-tesla
          show_in_sidebar: true
          require_admin: true
          filename: tesla-admin-dashboard.yaml

    # Packages — organized config by area/function
    # homeassistant:
    #   packages: !include_dir_named packages/

  automations.yaml: "[]"
  scripts.yaml: |
    # Tesla charge-cable release — unlocks the charge-cable latch so the car can
    # be unplugged. Releases the CABLE LOCK only; no drive/door/cabin/trunk
    # actions. Actuator: lock.unlock on the Tessie "charge cable lock" entity.
    #
    # Entities are for the vehicle "Driveway Model Y" (Tessie display name). If
    # the car is renamed or replaced, update the entity_ids below to match.
    #
    # Gates are fail-closed: unknown/unavailable state aborts (never unlocks).
    tesla_charge_port_unlatch:
      alias: "Tesla — Release Charge Cable"
      icon: mdi:ev-plug-tesla
      mode: single
      sequence:
        - choose:
            # Gate 1 — feature hard-disabled by the kill switch
            - conditions:
                - condition: state
                  entity_id: input_boolean.tesla_unlatch_enabled
                  state: "off"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Cable"
                    message: "release blocked — kill switch off"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Cable"
                    message: "Charge-cable release is turned off."
            # Gate 2 — must be at home (fail-closed: away/unknown aborts).
            # Tessie's device_tracker reports the state as "Home" (capitalized,
            # not the zone slug "home"), so match both casings.
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: device_tracker.driveway_model_y_location
                      state:
                        - "home"
                        - "Home"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Cable"
                    message: "release blocked — not home"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Cable"
                    message: "Tesla isn't home."
            # Gate 3 — cable must be plugged in (also proves the car is parked at
            # the charger). Fail-closed: not 'on' / unknown aborts.
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.driveway_model_y_charge_cable
                      state: "on"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Cable"
                    message: "release blocked — no cable plugged in"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Cable"
                    message: "No cable plugged in."
            # Gate 4 — not actively in gear (block Drive/Reverse/Neutral). A
            # plugged-in car at home can't be driving; this is belt-and-suspenders
            # against a stale/odd shift_state. Tessie reports shift_state
            # lowercase (e.g. "p"), so block both casings of d/r/n.
            - conditions:
                - condition: state
                  entity_id: sensor.driveway_model_y_shift_state
                  state:
                    - "d"
                    - "r"
                    - "n"
                    - "D"
                    - "R"
                    - "N"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Cable"
                    message: "release blocked — not parked"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Cable"
                    message: "Tesla isn't parked."
            # Gate 5 — battery >= 50% (fail-closed: below 50 OR unknown aborts)
            - conditions:
                - condition: not
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.driveway_model_y_battery_level
                      above: 49
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Cable"
                    message: "release blocked — battery below 50% or unknown"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Cable"
                    message: "Tesla battery too low — leave it plugged in."
            # Gate 6 — already unlocked (idempotent no-op)
            - conditions:
                - condition: state
                  entity_id: lock.driveway_model_y_charge_cable_lock
                  state: "unlocked"
              sequence:
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Cable"
                    message: "Charge cable already unlocked."
          # All gates passed — release the cable latch
          default:
            - service: lock.unlock
              target:
                entity_id: lock.driveway_model_y_charge_cable_lock
            - service: logbook.log
              data:
                name: "Tesla Charge Cable"
                message: "released via HA dashboard (all gates passed)"
                entity_id: lock.driveway_model_y_charge_cable_lock
            - service: persistent_notification.create
              data:
                notification_id: tesla_unlatch
                title: "Tesla Charge Cable"
                message: "Charge cable unlocked — you can unplug now."
    # Tesla door unlock — unlocks ALL doors (Tesla has no per-door command), then
    # auto-re-locks after 60s. Intent: let someone open the driver door to stow
    # the charge adapter, then the car secures itself. mode:restart so a second
    # press restarts the 60s window. Caveat: the relock relies on this script
    # staying alive for the delay; an HA restart inside the window would skip it
    # (car stays unlocked — but only ever while parked at home).
    tesla_unlock_doors:
      alias: "Tesla — Unlock Doors (auto-relock 1 min)"
      icon: mdi:car-door
      mode: restart
      sequence:
        - choose:
            # Gate 1 — feature hard-disabled by its own kill switch
            - conditions:
                - condition: state
                  entity_id: input_boolean.tesla_unlock_doors_enabled
                  state: "off"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Doors"
                    message: "unlock blocked — kill switch off"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlock_doors
                    title: "Tesla Doors"
                    message: "Door unlock is turned off."
            # Gate 2 — must be at home (fail-closed; Tessie reports "Home")
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: device_tracker.driveway_model_y_location
                      state:
                        - "home"
                        - "Home"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Doors"
                    message: "unlock blocked — not home"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlock_doors
                    title: "Tesla Doors"
                    message: "Tesla isn't home."
            # Gate 3 — not actively in gear (block d/r/n, both casings)
            - conditions:
                - condition: state
                  entity_id: sensor.driveway_model_y_shift_state
                  state:
                    - "d"
                    - "r"
                    - "n"
                    - "D"
                    - "R"
                    - "N"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Doors"
                    message: "unlock blocked — not parked"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlock_doors
                    title: "Tesla Doors"
                    message: "Tesla isn't parked."
          # All gates passed — unlock all doors, hold 60s, then re-lock
          default:
            - service: lock.unlock
              target:
                entity_id: lock.driveway_model_y_lock
            - service: logbook.log
              data:
                name: "Tesla Doors"
                message: "doors unlocked via HA dashboard (auto-relock in 60s)"
                entity_id: lock.driveway_model_y_lock
            - service: persistent_notification.create
              data:
                notification_id: tesla_unlock_doors
                title: "Tesla Doors"
                message: "Doors unlocked — they will lock again in 1 minute."
            - delay: "00:01:00"
            - service: lock.lock
              target:
                entity_id: lock.driveway_model_y_lock
            - service: logbook.log
              data:
                name: "Tesla Doors"
                message: "doors auto-relocked after 60s"
                entity_id: lock.driveway_model_y_lock
            - service: persistent_notification.create
              data:
                notification_id: tesla_unlock_doors
                title: "Tesla Doors"
                message: "Doors re-locked."
  scenes.yaml: "[]"
  tesla-dashboard.yaml: |
    # User-facing dashboard: release button + a READ-ONLY status card. Visible to
    # all logged-in users (no require_admin). The status card shows only the
    # sensors the button validates against (plugged, battery, gear, location) —
    # all read-only, no toggles. The two interactive controls (kill switch +
    # cable lock) are deliberately excluded; they live on "Tesla (Admin)" so a
    # non-admin can ONLY trigger the gated release, never unlock directly or flip
    # the kill switch.
    title: Tesla
    views:
      - title: Charge
        path: charge
        icon: mdi:ev-plug-tesla
        cards:
          - type: button
            name: Release Charge Cable
            icon: mdi:ev-plug-tesla
            icon_height: 80px
            tap_action:
              action: perform-action
              perform_action: script.tesla_charge_port_unlatch
          - type: button
            name: Unlock Doors (locks again in 1 min)
            icon: mdi:car-door
            icon_height: 80px
            tap_action:
              action: perform-action
              perform_action: script.tesla_unlock_doors
          - type: entities
            title: Status
            entities:
              - entity: binary_sensor.driveway_model_y_charge_cable
                name: Cable plugged in
              - entity: sensor.driveway_model_y_battery_level
                name: Battery
              - entity: sensor.driveway_model_y_shift_state
                name: Gear
              - entity: device_tracker.driveway_model_y_location
                name: Location
  tesla-admin-dashboard.yaml: |
    # Admin-only dashboard (registered with require_admin: true). Same release
    # button PLUS the full status card (kill switch, cable lock, plugged,
    # battery, gear, location). Non-admin accounts never see this page.
    title: Tesla (Admin)
    views:
      - title: Charge
        path: charge
        icon: mdi:ev-plug-tesla
        cards:
          - type: button
            name: Release Charge Cable
            icon: mdi:ev-plug-tesla
            icon_height: 80px
            tap_action:
              action: perform-action
              perform_action: script.tesla_charge_port_unlatch
          - type: button
            name: Unlock Doors (locks again in 1 min)
            icon: mdi:car-door
            icon_height: 80px
            tap_action:
              action: perform-action
              perform_action: script.tesla_unlock_doors
          - type: entities
            title: Status
            entities:
              - entity: input_boolean.tesla_unlatch_enabled
                name: Release enabled (kill switch)
              - entity: input_boolean.tesla_unlock_doors_enabled
                name: Door unlock enabled (kill switch)
              - entity: lock.driveway_model_y_charge_cable_lock
                name: Cable lock
              - entity: lock.driveway_model_y_lock
                name: Car doors lock
              - entity: binary_sensor.driveway_model_y_front_driver_door
                name: Driver door
              - entity: binary_sensor.driveway_model_y_charge_cable
                name: Cable plugged in
              - entity: sensor.driveway_model_y_battery_level
                name: Battery
              - entity: sensor.driveway_model_y_shift_state
                name: Gear
              - entity: device_tracker.driveway_model_y_location
                name: Location
