# Shared Gateway resource for kube-world
#
# All HTTPRoutes reference this Gateway. To switch ingress
# implementations (e.g., Traefik → Istio), change gatewayClassName
# here — no changes needed on individual HTTPRoutes.
#
# Listener ports must match Traefik's actual entrypoint ports:
#   - With hostNetwork: true → ports are 80 and 443
#   - Without hostNetwork (svclb) → ports would be 8000 and 8443
#
# The certificateRefs point at the kube-world-tls secret which holds
# the Let's Encrypt wildcard cert. Bootstrap creates a placeholder
# self-signed cert at this name so the Gateway is accepted immediately;
# cert-manager replaces it with the real LE cert once DNS-01 completes.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kube-world-gateway
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: kube-world
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: kube-world-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
