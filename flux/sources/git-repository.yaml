# Flux GitRepository source
# Points to the self-hosted GitLab on the central Pi node
#
# GitLab runs natively on the Pi (systemd, not K8s) at port 80.
# Flux accesses it via the K8s Service endpoint in the gitlab namespace,
# or directly via the host IP.
#
# GitHub remains as a mirror (push to both remotes).
# To revert to GitHub: change url back to https://github.com/jasondashaer/kube-world.git
# and remove secretRef.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kube-world
  namespace: flux-system
spec:
  interval: 30s
  url: http://gitlab.10.5.5.249.nip.io/root/kube-world.git
  ref:
    branch: main
  # GitLab repo is private — authenticate with token
  secretRef:
    name: gitlab-credentials
