# Saitama site — Companion triggers.
#
# Pre-service choreography is two-step around the ProPresenter video
# countdown timer (clock 0):
#
#   T-60s : load Mustard Seed graphic onto ATEM MP1, FTB, start stream,
#           FTB-back. Audience tuning in sees graphic via stream.
#   T-15s : FTB, start record + unmute mixer record bus, switch program
#           to HDMI 1 (camera), FTB-back. Service goes "Live".
#
# Two paths fire each event:
#   1. Natural threshold cross — PP timer crosses the threshold value
#      (`= "00:01:00"` etc.) AND ARM gate AND step-counter matches.
#   2. Operator skip — pressing the SVC START / SKIP pad twice within
#      5 s pulses `skip_now=1`. Skip-* triggers below fire the same
#      actions immediately and advance the step counter.
#
# The step counter (`internal:custom_next_event_step`) gates each
# trigger so the natural-cross trigger won't double-fire if the
# operator already skipped past it. Counter values:
#   0 = idle (not armed)
#   1 = armed, pre-stream
#   2 = streamed, pre-camera
#   3 = live
#
# Variable label sanitization: "ProPresenter (Saitama)" →
# "ProPresenter__Saitama_". Timer reference =
# $(ProPresenter__Saitama_:video_countdown_timer).
#
# FTB pacing: bmd-atem fadeToBlackAuto runs at the ATEM-configured FTB
# rate (default ~25 frames). 1500 ms internal:wait between FTB and the
# next action gives the fade time to complete. Tune the wait if the
# Saitama ATEM is set to a different rate.
#
# All ARM-gated triggers ship DISABLED. Enable per-trigger after a
# walkthrough with mixer + ATEM connected and the Mustard Seed logo
# uploaded to ATEM still slot 1 by atem-media-bridge.

triggers:
  # ═══════════════════════════════════════════
  # SYSTEM TRIGGERS (always active)
  # ═══════════════════════════════════════════

  - name: "Startup: Set service mode"
    enabled: true
    sort_order: 0
    events:
      - type: startup
        options: { delay: 5000 }
    actions:
      - action: internal:custom_variable_set_value
        options: { name: "service_mode", value: "Ready" }
      - action: internal:custom_variable_set_value
        options: { name: "service_armed", value: "0" }
      - action: internal:custom_variable_set_value
        options: { name: "close_stage", value: "Idle" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_step", value: "0" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_label", value: "SVC START" }
      - action: internal:custom_variable_set_value
        options: { name: "skip_now", value: "0" }

  # ═══════════════════════════════════════════
  # PRE-SERVICE FLOW (ARM-gated, threshold-driven)
  # ═══════════════════════════════════════════

  # T-60s: graphic on air → FTB → start stream → FTB back (graphic shown)
  - name: "Saitama Pre-Service: Stream goes live at 1min"
    enabled: false
    sort_order: 10
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_service_armed"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_next_event_step"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "ProPresenter__Saitama_:video_countdown_timer"
          value: "00:01:00"
    actions:
      - action: atem_saitama:mediaPlayerSource
        options: { mediaplayer: 0, source: "still1" }
      - action: atem_saitama:program
        options: { input: 3010, mixeffect: 0 }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
      - action: internal:wait
        options: { time: "1500" }
      - action: atem_saitama:streamStartStop
        options: { stream: "true" }
      - action: internal:wait
        options: { time: "500" }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
      - action: internal:custom_variable_set_value
        options: { name: "service_mode", value: "Pre-Service" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_step", value: "2" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_label", value: "Camera" }

  # T-15s: FTB → start record + unmute record bus → swap to HDMI 1 → FTB back
  - name: "Saitama Pre-Service: Go to camera + record at 15s"
    enabled: false
    sort_order: 11
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_service_armed"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_next_event_step"
          value: "2"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "ProPresenter__Saitama_:video_countdown_timer"
          value: "00:00:15"
    actions:
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
      - action: internal:wait
        options: { time: "1500" }
      - action: yamaha_saitama:MIXER_Current/Mix/Fader/On
        options: { X: "$(internal:custom_record_bus_idx)", Val: 1 }
      - action: atem_saitama:recordStartStop
        options: { record: "true" }
      - action: atem_saitama:program
        options: { input: 1, mixeffect: 0 }
      - action: internal:wait
        options: { time: "500" }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
      - action: internal:custom_variable_set_value
        options: { name: "service_mode", value: "Live" }
      - action: internal:custom_variable_set_value
        options: { name: "service_armed", value: "0" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_step", value: "3" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_label", value: "Live" }

  # ═══════════════════════════════════════════
  # SKIP TRIGGERS (operator-driven, fire immediately on skip_now=1)
  # ═══════════════════════════════════════════
  # Each watches `skip_now=1` AND a specific `next_event_step` value
  # so the right block fires regardless of where in the chain we are.

  # Skip from idle → arm + start PP clock + advance to step 1.
  - name: "Saitama Skip: Arm service from idle"
    enabled: true
    sort_order: 20
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_skip_now"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_next_event_step"
          value: "0"
    actions:
      - action: internal:custom_variable_set_value
        options: { name: "service_armed", value: "1" }
      # Start the timer the SUN AM / THU PM preset selected. The new
      # propresenter-api module's timerOperation accepts the timer's
      # name as a free-text id; the callback resolves it against PP's
      # live timer list (matches by uuid, name, or numeric index).
      - action: propresenter_saitama:timerOperation
        options:
          timer_id_dropdown: "manually_specify_timerid"
          timer_id_text: "$(internal:custom_active_timer_name)"
          timer_operation: "start"
      - action: internal:custom_variable_set_value
        options: { name: "service_mode", value: "Armed" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_step", value: "1" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_label", value: "Stream" }

  # Skip pre-stream → fire T-60 actions immediately.
  - name: "Saitama Skip: Fire stream-start now"
    enabled: false
    sort_order: 21
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_skip_now"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_next_event_step"
          value: "1"
    actions:
      - action: atem_saitama:mediaPlayerSource
        options: { mediaplayer: 0, source: "still1" }
      - action: atem_saitama:program
        options: { input: 3010, mixeffect: 0 }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
      - action: internal:wait
        options: { time: "1500" }
      - action: atem_saitama:streamStartStop
        options: { stream: "true" }
      - action: internal:wait
        options: { time: "500" }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
      - action: internal:custom_variable_set_value
        options: { name: "service_mode", value: "Pre-Service" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_step", value: "2" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_label", value: "Camera" }

  # Skip pre-camera → fire T-15 actions immediately.
  - name: "Saitama Skip: Fire camera + record now"
    enabled: false
    sort_order: 22
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_skip_now"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_next_event_step"
          value: "2"
    actions:
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
      - action: internal:wait
        options: { time: "1500" }
      - action: yamaha_saitama:MIXER_Current/Mix/Fader/On
        options: { X: "$(internal:custom_record_bus_idx)", Val: 1 }
      - action: atem_saitama:recordStartStop
        options: { record: "true" }
      - action: atem_saitama:program
        options: { input: 1, mixeffect: 0 }
      - action: internal:wait
        options: { time: "500" }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
      - action: internal:custom_variable_set_value
        options: { name: "service_mode", value: "Live" }
      - action: internal:custom_variable_set_value
        options: { name: "service_armed", value: "0" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_step", value: "3" }
      - action: internal:custom_variable_set_value
        options: { name: "next_event_label", value: "Live" }

  # ═══════════════════════════════════════════════════════════════════
  # GO LIVE chain — pulse-driven, arm-gated
  # ═══════════════════════════════════════════════════════════════════
  # The GO LIVE button on page 1 r2c0 sets `go_live_pulse = "1"`
  # for 100 ms. Each trigger below watches that variable AND its
  # arm_<action> gate (where applicable). Triggers fire in parallel
  # at the rising edge; each carries its own initial wait so the
  # composite sequence plays out:
  #
  #   0 ms      bridge wake + program → still 3010 (preroll)
  #   700 ms    FTB ON           (if arm_ftb=1)
  #   2700 ms   REC start        (if arm_rec=1)
  #   2700 ms   STREAM start     (if arm_stream=1)
  #   3700 ms   FTB OFF          (if arm_ftb=1)
  #   8700 ms   preview → cam 1 + AUTO (always) + service_mode=Live

  - name: "GO LIVE: 0ms preroll (bridge + still3010)"
    enabled: true
    sort_order: 100
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_go_live_pulse"
          value: "1"
    actions:
      - action: atem_media_bridge:post
        options: { url: "/refresh", body: "", contenttype: "application/json" }
      - action: internal:wait
        options: { time: "500" }
      - action: atem_saitama:mediaPlayerSource
        options: { mediaplayer: 0, source: "still1" }
      - action: atem_saitama:program
        options: { input: 3010, mixeffect: 0 }

  - name: "GO LIVE: 700ms FTB ON (if armed)"
    enabled: true
    sort_order: 101
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_go_live_pulse"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_arm_ftb"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "700" }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }

  - name: "GO LIVE: 2700ms REC start (if armed)"
    enabled: true
    sort_order: 102
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_go_live_pulse"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_arm_rec"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "2700" }
      - action: atem_saitama:recordStartStop
        options: { record: "toggle" }

  - name: "GO LIVE: 2700ms STREAM start (if armed)"
    enabled: true
    sort_order: 103
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_go_live_pulse"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_arm_stream"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "2700" }
      - action: atem_saitama:streamStartStop
        options: { stream: "toggle" }

  - name: "GO LIVE: 3700ms FTB OFF (if armed)"
    enabled: true
    sort_order: 104
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_go_live_pulse"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_arm_ftb"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "3700" }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }

  - name: "GO LIVE: 8700ms camera fade + service_mode=Live"
    enabled: true
    sort_order: 105
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_go_live_pulse"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "8700" }
      - action: atem_saitama:preview
        options: { input: 1, mixeffect: 0 }
      - action: atem_saitama:auto
        options: { mixeffect: 0 }
      - action: internal:custom_variable_set_value
        options: { name: "service_mode", value: "Live" }

  # ═══════════════════════════════════════════════════════════════════
  # END SVC chain — pulse-driven, arm-gated
  # ═══════════════════════════════════════════════════════════════════
  #   0 ms      preview → still 3010 + AUTO (logo fade-in)
  #   5000 ms   FTB ON           (if arm_ftb=1)
  #   7000 ms   REC stop         (if arm_rec=1)
  #   7000 ms   STREAM stop      (if arm_stream=1)
  #   7500 ms   service_mode=Idle + duck_active=0

  - name: "END SVC: 0ms logo fade"
    enabled: true
    sort_order: 110
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_end_svc_pulse"
          value: "1"
    actions:
      - action: atem_saitama:preview
        options: { input: 3010, mixeffect: 0 }
      - action: atem_saitama:auto
        options: { mixeffect: 0 }

  - name: "END SVC: 5000ms FTB ON (if armed)"
    enabled: true
    sort_order: 111
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_end_svc_pulse"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_arm_ftb"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "5000" }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }

  - name: "END SVC: 7000ms REC stop (if armed)"
    enabled: true
    sort_order: 112
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_end_svc_pulse"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_arm_rec"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "7000" }
      - action: atem_saitama:recordStartStop
        options: { record: "toggle" }

  - name: "END SVC: 7000ms STREAM stop (if armed)"
    enabled: true
    sort_order: 113
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_end_svc_pulse"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_arm_stream"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "7000" }
      - action: atem_saitama:streamStartStop
        options: { stream: "toggle" }

  - name: "END SVC: 7500ms finalize (service_mode=Idle + duck=0)"
    enabled: true
    sort_order: 114
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_end_svc_pulse"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "7500" }
      - action: internal:custom_variable_set_value
        options: { name: "service_mode", value: "Idle" }
      - action: internal:custom_variable_set_value
        options: { name: "duck_active", value: "0" }

  # FTB pair-up: END SVC's FTB ON slice (at 5000ms) leaves the
  # broadcast in FTB-ON state. Without a closing toggle, the next
  # GO LIVE press would invert FTB direction (toggle off instead
  # of on). This trigger fires the closing toggle so FTB lands OFF
  # at end of END SVC, leaving the next GO LIVE clean. Only fires
  # if arm_ftb was 1 (mirrors the conditional FTB ON slice).
  - name: "END SVC: 9500ms FTB OFF reset (if armed)"
    enabled: true
    sort_order: 115
    events:
      - type: condition_true
        options: {}
    conditions:
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_end_svc_pulse"
          value: "1"
      - type: internal:variable_value
        options:
          op: "eq"
          variable: "internal:custom_arm_ftb"
          value: "1"
    actions:
      - action: internal:wait
        options: { time: "9500" }
      - action: atem_saitama:fadeToBlackAuto
        options: { mixeffect: 0 }
