# Page 1: Home / Dashboard
# Status indicators and navigation to functional pages.
# This is a starter template — customize for your setup.

page:
  number: 1
  name: "Home"

buttons:
  # Top row — connection status indicators
  - row: 0
    col: 0
    style:
      text: "HA"
      bgcolor: "#CC0000"
    feedbacks:
      - type: homeassistant:connected
        style:
          bgcolor: "#00CC00"
          text: "HA\n● OK"

  - row: 0
    col: 7
    style:
      text: "$(internal:time_hms)"
      bgcolor: "#333333"
      size: 18

  # Middle rows — page navigation
  - row: 1
    col: 0
    style:
      text: "Lights\n照明"
      bgcolor: "#0066CC"
      size: 14
    actions:
      down:
        - action: internal:page_set
          options:
            page: 2

  - row: 1
    col: 1
    style:
      text: "Scenes\nシーン"
      bgcolor: "#0066CC"
      size: 14
    actions:
      down:
        - action: internal:page_set
          options:
            page: 3
