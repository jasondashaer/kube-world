# Let's Encrypt ClusterIssuer with Cloudflare DNS-01 solver
#
# Uses Cloudflare API to create TXT records for ACME DNS-01 challenges.
# This enables wildcard certificates (*.kubew.dev) which HTTP-01 cannot do.
#
# Prerequisites:
#   kubectl create secret generic cloudflare-api-token \
#     --from-literal=api-token=<your-token> \
#     -n cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: kube-world
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jackson@kubew.dev
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - kubew.dev
