# YIBC — Stream Deck MK2 Page 30: Operations (post-Yamaha-removal)
# 5x3 grid. Yamaha mixer buttons retired 2026-05-04 — operator
# controls Yamaha directly on the TF5 surface, Companion no longer
# routes audio. Yamaha YAML preserved under
# config/pages/yibc/archive/ for future resurrection.
#
# Layout intent:
#   Row 0: integration status indicators (no actions, just feedback
#          colors based on connection health).
#   Row 1: service automation flow (startup → start → stop → shutdown).
#   Row 2: nav (bottom-right → page 32 PP Messages).
#
# Layout:
#   Row 0: [PP]    [OBS]    [PTZ]    [—]       [—]
#   Row 1: [START] [SVC ▶]  [SVC ■]  [SHUTDWN] [—]
#   Row 2: [—]     [—]      [—]      [—]       [→ MSG]

page:
  number: 30
  name: "Ops"
  device: mk2

buttons:
  # ═══ Row 0: Integration status indicators ═══
  # Each cell shows label + connection-health color via
  # internal:instance_status feedback. No action on press (just visual
  # so operator can spot a dropped connection at a glance).

  - row: 0
    col: 0
    style:
      text: "ProP"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 14
    feedbacks:
      - type: internal:instance_status
        options:
          instance_id: "propresenter_yibc"
          ok_fg: 16777215
          ok_bg: 35840       # 0x008C00 dark green
          warning_fg: 0
          warning_bg: 16776960
          error_fg: 16777215
          error_bg: 13107200 # 0xC80000 red
          disabled_fg: 10066329
          disabled_bg: 2236962

  - row: 0
    col: 1
    style:
      text: "OBS"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 14
    feedbacks:
      - type: internal:instance_status
        options:
          instance_id: "obs_yibc"
          ok_fg: 16777215
          ok_bg: 35840
          warning_fg: 0
          warning_bg: 16776960
          error_fg: 16777215
          error_bg: 13107200
          disabled_fg: 10066329
          disabled_bg: 2236962

  - row: 0
    col: 2
    style:
      text: "PTZ"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 14
    feedbacks:
      - type: internal:instance_status
        options:
          instance_id: "ptz"
          ok_fg: 16777215
          ok_bg: 35840
          warning_fg: 0
          warning_bg: 16776960
          error_fg: 16777215
          error_bg: 13107200
          disabled_fg: 10066329
          disabled_bg: 2236962

  # Cols 3-4 reserved. HA + Spotify status removed 2026-05-04 — those
  # connections aren't actively used for live ops yet; can add back
  # when integrated.

  # ═══ Row 1: Service automation flow ═══

  # ── STARTUP ──
  # Stages OBS to Pre-Service scene + marks service_mode = Ready.
  # Idempotent — safe to repeat.
  - row: 1
    col: 0
    style:
      text: "Startup\n起動"
      bgcolor: "#006600"
      color: "#FFFFFF"
      size: 12
    actions:
      down:
        - action: obs_yibc:set_current_scene
          options: { scene: "Pre-Service" }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Ready" }

  # ── SVC START ──
  # Begin live service: PP timer + OBS stream + OBS recording.
  - row: 1
    col: 1
    style:
      text: "SVC\nSTART"
      bgcolor: "#118800"
      color: "#FFFFFF"
      size: 14
    actions:
      down:
        - action: propresenter_yibc:clockReset
          options: { clockIndex: "0" }
        - action: propresenter_yibc:clockStart
          options: { clockIndex: "0" }
        - action: obs_yibc:start_streaming
        - action: obs_yibc:start_recording
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Live" }
        - action: internal:custom_variable_set_value
          options: { name: "service_armed", value: "1" }

  # ── SVC STOP ──
  # End service: stop OBS stream/record + clear PP + stop clock.
  - row: 1
    col: 2
    style:
      text: "SVC\nSTOP"
      bgcolor: "#883300"
      color: "#FFFFFF"
      size: 14
    actions:
      down:
        - action: obs_yibc:stop_recording
        - action: obs_yibc:stop_streaming
        - action: propresenter_yibc:clockStop
          options: { clockIndex: "0" }
        - action: propresenter_yibc:clearall
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Stopped" }
        - action: internal:custom_variable_set_value
          options: { name: "service_armed", value: "0" }

  # ── SHUTDOWN ──
  # Two-step confirm with 5s auto-timeout. Step 1 primes (changes
  # color + label). Step 2 (within 5s) commits the close: stop
  # OBS rec/stream, clear PP, mark service Off. Long-press also
  # commits in one step for emergency.
  - row: 1
    col: 3
    style:
      text: "Shutdown\n終了"
      bgcolor: "#660000"
      color: "#FFFFFF"
      size: 12
    steps:
      - style:
          text: "Shutdown\n終了"
          bgcolor: "#660000"
          color: "#FFFFFF"
          size: 12
        actions:
          down:
            - action: internal:step_delta
              options: { amount: 1 }
            - action: internal:wait
              options: { time: "5000" }
            - action: internal:step_delta
              options: { amount: -1 }
      - style:
          text: "CONFIRM?\n確認？"
          bgcolor: "#FF0000"
          color: "#FFFFFF"
          size: 12
        actions:
          down:
            - action: obs_yibc:stop_recording
            - action: obs_yibc:stop_streaming
            - action: propresenter_yibc:clockStop
              options: { clockIndex: "0" }
            - action: propresenter_yibc:clearall
            - action: internal:custom_variable_set_value
              options: { name: "service_mode", value: "Off" }
            - action: internal:custom_variable_set_value
              options: { name: "service_armed", value: "0" }
            - action: internal:step_delta
              options: { amount: -1 }

  # ── Spare slot ──
  # Reserved for future automation (e.g. PANIC, mid-service action).
  - row: 1
    col: 4
    style:
      text: "$(internal:custom_service_mode)"
      bgcolor: "#222222"
      color: "#888888"
      size: 14

  # ═══ Row 2: Nav ═══
  # Bottom-right → PP Messages (page 32). Mirrors page 32's → OPS
  # button so MK2 has a 2-page swap.

  - row: 2
    col: 4
    style:
      text: "→ MSG"
      bgcolor: "#003366"
      color: "#FFFFFF"
      size: 14
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 32 }
