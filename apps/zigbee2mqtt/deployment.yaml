# Zigbee2MQTT — bridges Zigbee devices to MQTT
# Requires a Zigbee coordinator USB dongle (Sonoff, ConBee, etc.)
# Publishes device state to Mosquitto; HA reads via MQTT integration.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-config
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: zigbee2mqtt
    app.kubernetes.io/part-of: kube-world
data:
  configuration.yaml: |
    homeassistant: true
    permit_join: false
    mqtt:
      base_topic: zigbee2mqtt
      server: mqtt://mosquitto.home-assistant.svc.cluster.local:1883
    serial:
      port: /dev/ttyUSB0
    frontend:
      port: 8080
    advanced:
      log_level: info
      network_key: GENERATE

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: zigbee2mqtt
    app.kubernetes.io/part-of: kube-world
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zigbee2mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
    spec:
      # Init container checks for the Zigbee dongle before starting.
      # If no dongle is found, it exits cleanly so the main container
      # starts anyway (with the web UI showing an error instead of
      # crashlooping the whole pod).
      initContainers:
        - name: init-config
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              # Check for Zigbee dongle
              if [ -c /dev/ttyUSB0 ] || [ -c /dev/zigbee ]; then
                echo "Zigbee dongle found: $(ls -la /dev/ttyUSB0 /dev/zigbee 2>/dev/null | head -1)"
              else
                echo "WARNING: No Zigbee dongle detected at /dev/ttyUSB0 or /dev/zigbee"
                echo "Zigbee2MQTT will start but won't connect to devices."
              fi
              # Copy config from ConfigMap to PVC (Z2M needs to write to it
              # for network_key generation and runtime settings)
              if [ ! -f /app/data/configuration.yaml ] || [ -f /config-template/configuration.yaml ]; then
                cp /config-template/configuration.yaml /app/data/configuration.yaml
                echo "Configuration copied to PVC"
              fi
          securityContext:
            privileged: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /config-template
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt:1.42.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: data
              mountPath: /app/data
          # Privileged for access to host USB devices (/dev/ttyUSB0)
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
        - name: config
          configMap:
            name: zigbee2mqtt-config
        # No explicit /dev/ttyUSB0 mount — privileged gives access
        # to all host devices. Explicit mounts shadow real device nodes.

---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: zigbee2mqtt
    app.kubernetes.io/part-of: kube-world
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: zigbee2mqtt
