# Template for the zitadel-groupsync webhook credentials.
#
# Copy to groupsync-credentials.unsealed.yaml (gitignored), fill in real values,
# then seal with kubeseal (per docs/companion/guides/secrets-and-credentials.md):
#
#   kubeseal --controller-namespace sealed-secrets \
#     --controller-name sealed-secrets-controller \
#     --kubeconfig ~/.kube/pi-config \
#     -f groupsync-credentials.unsealed.yaml \
#     -w groupsync-credentials.sealed.yaml
#
# Values:
#   ZITADEL_API_TOKEN  PAT able to write user metadata (reuse iam-admin-pat value,
#                      or a scoped service-user PAT).
#   TARGET_SIGNING_KEY HMAC key returned when the Actions v2 Target is created
#                      (POST /v2beta/actions/targets -> .signingKey). seed-zitadel.sh
#                      can also write this secret imperatively after creating the Target.
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-groupsync-credentials
  namespace: zitadel
type: Opaque
stringData:
  ZITADEL_API_TOKEN: "REPLACE_WITH_PAT"
  TARGET_SIGNING_KEY: "REPLACE_WITH_TARGET_SIGNING_KEY"
