# Flux Kustomization for Sealed Secrets controller.
#
# Lives at the central cluster (NOT applied via Karmada — controller
# runs per-cluster because each cluster needs its own keypair). For
# edge clusters, this same Kustomization is duplicated in each cluster's
# infrastructure/clusters/<edge>/ with a local kubeConfig.
#
# Why not Karmada-propagated: each cluster must have a unique keypair
# so a developer compromise of dev cluster's pubkey doesn't leak prod
# secrets. The HelmRelease itself could be propagated, but the
# controller-generated keypair must remain cluster-local.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 30m
  path: ./infrastructure/sealed-secrets
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: kube-world
  # NO kubeConfig override — applies to local pi-central cluster.
  # For each edge cluster needing Sealed Secrets, add a similar
  # Kustomization with `kubeConfig: { secretRef: { name: <edge>-kubeconfig } }`
  # in infrastructure-<edge>.yaml.
