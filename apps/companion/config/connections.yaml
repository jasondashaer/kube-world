# Companion Connection Definitions
#
# Both YIBC and Saitama instances defined simultaneously.
# At each location, only the local connections will succeed —
# the others will show as disconnected. This is expected.

meta:
  companion_version: "4.2"

connections:
  # ═══════════════════════════════════════════
  # YIBC connections (used by Plus + MK2)
  # ═══════════════════════════════════════════

  # Home Assistant — YIBC
  - id: homeassistant
    module: "homeassistant-server"
    label: "Home Assistant"
    enabled: true
    config:
      host: "http://home-assistant.home-assistant.svc.cluster.local:8123"
      access_token: ""

  # PTZ Camera — YIBC only
  - id: ptz
    module: "ptzoptics-visca"
    label: "PTZ Camera"
    enabled: true
    config:
      host: "192.168.1.113"
      port: 5678
      protocol: "tcp"

  # Yamaha TF5 — YIBC
  - id: yamaha_yibc
    module: "yamaha-rcp"
    label: "Yamaha TF5 (YIBC)"
    enabled: true
    config:
      host: "192.168.1.54"
      model: "TF"

  # ProPresenter 7 v18.4 — YIBC
  - id: propresenter_yibc
    module: "renewedvision-propresenter"
    label: "ProPresenter (YIBC)"
    enabled: true
    config:
      host: "192.168.1.2"
      port: "1025"
      pass: "YIBC"
      use_sd: "yes"
      sdpass: ""
      sendPresentationCurrentMsgs: "disabled"
      timerPolling: "enabled"

  # OBS Studio — YIBC. Placeholder host/port; update after install.
  # Module requires obs-websocket plugin v5+ on the OBS host.
  - id: obs_yibc
    module: "bitfocus-obs-websocket"
    label: "OBS (YIBC)"
    enabled: true
    config:
      host: "192.168.1.50"
      port: "4455"
      password: ""

  # Spotify — YIBC. OAuth happens via Companion UI on first connect.
  # Premium account required for playback control. Account-scoped, not
  # device-scoped — re-auth needed when swapping accounts but no code change.
  - id: spotify_yibc
    module: "bitfocus-spotify-premium"
    label: "Spotify (YIBC)"
    enabled: true
    config:
      clientId: ""
      clientSecret: ""

  # ═══════════════════════════════════════════
  # Saitama connections (used by XL)
  # ═══════════════════════════════════════════

  # Yamaha TF1 — Saitama
  - id: yamaha_saitama
    module: "yamaha-rcp"
    label: "Yamaha TF1 (Saitama)"
    enabled: true
    config:
      host: "192.168.10.30"
      model: "TF"

  # ProPresenter 7 v21.3 — Saitama
  - id: propresenter_saitama
    module: "renewedvision-propresenter"
    label: "ProPresenter (Saitama)"
    enabled: true
    config:
      host: "192.168.68.55"
      port: "53678"
      pass: "test1234"
      use_sd: "yes"
      sdpass: ""
      sendPresentationCurrentMsgs: "disabled"
      timerPolling: "enabled"

  # OBS Studio — Saitama. Placeholder host/port.
  - id: obs_saitama
    module: "bitfocus-obs-websocket"
    label: "OBS (Saitama)"
    enabled: true
    config:
      host: "192.168.10.50"
      port: "4455"
      password: ""

  # ATEM switcher — Saitama. Placeholder host.
  - id: atem_saitama
    module: "bmd-atem"
    label: "ATEM (Saitama)"
    enabled: true
    config:
      host: "192.168.10.40"

  # Spotify — Saitama (separate account). OAuth via Companion UI.
  - id: spotify_saitama
    module: "bitfocus-spotify-premium"
    label: "Spotify (Saitama)"
    enabled: true
    config:
      clientId: ""
      clientSecret: ""

  # Future: ATEM YIBC, Blackmagic HyperDeck recorder
