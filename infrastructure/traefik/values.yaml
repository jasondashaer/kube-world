# Traefik Ingress Controller - Pi-optimized values
# Deployed via Helm in the kube-system namespace
#
# Uses hostNetwork: true so Traefik binds directly to the host's network
# stack on ALL interfaces — LAN (10.x.x.x), Tailscale (100.x.x.x), and
# loopback. This is critical for the kube-world architecture where
# edge clusters reach Rancher via the central Pi's Tailscale IP.
#
# Why hostNetwork instead of LoadBalancer + servicelb:
#   K3s's servicelb (klipper-lb) spawns svclb pods that bind to the
#   node's InternalIP only (typically the LAN interface). Traffic
#   arriving on the Tailscale interface gets dropped because nothing
#   listens there. hostNetwork bypasses this entirely — Traefik IS on
#   the host network and sees all interfaces directly.
#
# Access paths:
#   http://<any-node-ip>:80    — via hostNetwork
#   https://<any-node-ip>:443  — via hostNetwork
#
# Gateway API routes traffic by hostname (e.g., gitlab.kubew.dev)
# to the appropriate backend service.

# Resource constraints for Pi 5
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Single replica (single-node cluster)
deployment:
  replicas: 1
  # Use cluster DNS even with hostNetwork so Traefik can resolve
  # cluster-internal service names (needed for ForwardAuth middleware).
  dnsPolicy: ClusterFirstWithHostNet
  # hostNetwork + single-node + default RollingUpdate (maxSurge=1) gets
  # stuck: the new pod tries to bind 80/443 already held by the old.
  # Force kill-before-create so the rollout completes cleanly.
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# hostNetwork puts the Traefik pod directly on the node's network stack.
# With this, the ports below bind to 0.0.0.0 on the host (all interfaces).
hostNetwork: true

# Run as root so we can bind privileged ports (80, 443) with hostNetwork.
# NET_BIND_SERVICE as a non-root ambient capability doesn't work with the
# official Traefik image (binary lacks file capabilities). Running as root
# is acceptable for a private homelab single-node cluster.
securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

# When using hostNetwork, Traefik must listen on the actual ports we want
# (80/443), not the default internal ports (8000/8443).
ports:
  traefik:
    port: 9000
    expose:
      default: false
  web:
    port: 80
    expose:
      default: true
  websecure:
    port: 443
    expose:
      default: true

# ClusterIP service (sufficient for in-cluster access; hostNetwork
# handles external access). No LoadBalancer or svclb needed.
service:
  type: ClusterIP

# Access logs (lightweight)
logs:
  access:
    enabled: true
    format: json

# Dashboard (accessible via port-forward only)
ingressRoute:
  dashboard:
    enabled: false

# Providers
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: true

# Gateway API — Traefik auto-creates a GatewayClass.
# We manage our own Gateway resource in infrastructure/gateway/gateway.yaml
gateway:
  enabled: false
