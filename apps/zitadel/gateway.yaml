# Zitadel HTTPRoute via Gateway API
# Routes external traffic to Zitadel identity provider
#
# Zitadel must be accessible from:
#   - Browsers (SSO login flows)
#   - Cloud providers (SAML/OIDC federation token validation)
#   - K8s API servers (OIDC token verification)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: zitadel
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/part-of: kube-world
spec:
  parentRefs:
    - name: kube-world-gateway
      namespace: kube-system
  hostnames:
    - "auth.kubew.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zitadel
          port: 80
