# oauth2-proxy for Home Assistant — Zitadel OIDC authentication.
# Runs as a separate service; Traefik ForwardAuth middleware delegates
# authentication to this proxy before passing requests to HA.
#
# Flow: Client → Traefik → ForwardAuth(oauth2-proxy) → HA
# If not authenticated, oauth2-proxy redirects to Zitadel login.
# After login, sets X-Forwarded-User header for HA.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: kube-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.kubew.dev
            - --redirect-url=https://ha.edge1.kubew.dev/oauth2/callback
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-domain=.kubew.dev
            - --set-xauthrequest=true
            - --set-authorization-header=true
            - --pass-user-headers=true
            - --scope=openid profile email
            - --skip-provider-button=true
            - --code-challenge-method=S256
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: zitadel-oidc-homeassistant
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zitadel-oidc-homeassistant
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: zitadel-oidc-homeassistant
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: kube-world
spec:
  type: ClusterIP
  ports:
    - port: 4180
      targetPort: 4180
      name: http
  selector:
    app.kubernetes.io/name: oauth2-proxy
