# VS Code Server — web-based code editor for HA config files
# Mounts the HA config PVC for direct editing of configuration.yaml,
# automations, packages, and custom components.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/part-of: kube-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
    spec:
      containers:
        - name: code-server
          image: ghcr.io/coder/code-server:4.96.4
          imagePullPolicy: IfNotPresent
          args:
            - --auth
            - none
            - --port
            - "8443"
            - /config
          ports:
            - name: http
              containerPort: 8443
          env:
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: ha-config
              mountPath: /config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 10
      volumes:
        - name: ha-config
          persistentVolumeClaim:
            claimName: home-assistant-config

---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/part-of: kube-world
spec:
  type: ClusterIP
  ports:
    - port: 8443
      targetPort: 8443
      name: http
  selector:
    app.kubernetes.io/name: code-server
