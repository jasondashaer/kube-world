# Home Assistant Kubernetes Deployment
# Optimized for Raspberry Pi with IoT protocol support
---
apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
    workload-type: iot

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
    app.kubernetes.io/component: core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - iot
            - weight: 80
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - edge
            - weight: 50
              preference:
                matchExpressions:
                  - key: hardware
                    operator: In
                    values:
                      - raspberry-pi
                      - raspberry-pi-5

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      initContainers:
        # Install hass-oidc-auth custom component for Zitadel SSO.
        # Clones the component into the PVC, then patches injection.js
        # with our simplified version from the ConfigMap.
        - name: install-oidc-component
          image: docker.io/library/alpine:3.21
          env:
            - name: HA_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ha-oidc-config
                  key: client-id
                  optional: true
            - name: HA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ha-oidc-config
                  key: client-secret
                  optional: true
            - name: HA_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: ha-oidc-config
                  key: domain
                  optional: true
            - name: HA_LOCAL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ha-oidc-config
                  key: local-username
                  optional: true
            - name: HA_LOCAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ha-oidc-config
                  key: local-password
                  optional: true
          command:
            - sh
            - -c
            - |
              apk add --no-cache git python3 py3-bcrypt py3-jwt >/dev/null 2>&1

              # 1. Install OIDC custom component
              COMP_DIR="/config/custom_components/auth_oidc"
              if [ ! -f "$COMP_DIR/manifest.json" ]; then
                echo "Installing hass-oidc-auth..."
                cd /tmp
                git clone --depth 1 https://github.com/christiaangoossens/hass-oidc-auth.git
                mkdir -p /config/custom_components
                cp -r hass-oidc-auth/custom_components/auth_oidc "$COMP_DIR"
                rm -rf hass-oidc-auth
              else
                echo "hass-oidc-auth already installed"
              fi
              echo "Patching injection.js..."
              cp /config-templates/injection.js "$COMP_DIR/static/injection.js"

              # 2. Pre-seed onboarding + auth to skip the first-time wizard.
              # Only runs on fresh PVC (no .storage/onboarding file yet).
              mkdir -p /config/.storage
              if [ ! -f /config/.storage/onboarding ]; then
                echo "Pre-seeding onboarding state..."

                # Mark all onboarding steps as done
                cat > /config/.storage/onboarding << 'ONBOARD'
              {"version":4,"minor_version":1,"key":"onboarding","data":{"done":["user","core_config","analytics","integration"]}}
              ONBOARD

                # Create admin user with both OIDC (for web SSO) and local
                # password (for the HA mobile app which can't handle OIDC).
                HA_LOCAL_USERNAME="${HA_LOCAL_USERNAME:-admin}" \
                HA_LOCAL_PASSWORD="${HA_LOCAL_PASSWORD:-}" \
                python3 << 'PYEOF'
              import json, os, uuid
              import bcrypt

              admin_id = uuid.uuid4().hex
              auth = {
                'version': 1,
                'minor_version': 1,
                'key': 'auth',
                'data': {
                  'users': [
                    {
                      'id': admin_id,
                      'group_ids': ['system-admin'],
                      'is_owner': True,
                      'is_active': True,
                      'name': 'Admin',
                      'system_generated': False,
                      'local_only': False,
                    },
                    {
                      'id': uuid.uuid4().hex,
                      'group_ids': ['system-read-only'],
                      'is_owner': False,
                      'is_active': True,
                      'name': 'Home Assistant Content',
                      'system_generated': True,
                      'local_only': False,
                    },
                    {
                      'id': uuid.uuid4().hex,
                      'group_ids': ['system-admin'],
                      'is_owner': False,
                      'is_active': True,
                      'name': 'Home Assistant Cast',
                      'system_generated': True,
                      'local_only': False,
                    },
                  ],
                  'groups': [
                    {'id': 'system-admin', 'name': 'Administrators'},
                    {'id': 'system-users', 'name': 'Users'},
                    {'id': 'system-read-only', 'name': 'Read Only'},
                  ],
                  'credentials': [],
                  'refresh_tokens': [],
                }
              }

              # If a local password is provided, create the local credential.
              # The HA mobile app needs this since it can't handle OIDC.
              import base64
              local_user = os.environ.get('HA_LOCAL_USERNAME', 'admin')
              local_pass = os.environ.get('HA_LOCAL_PASSWORD', '')
              if local_pass:
                  # HA stores bcrypt hash base64-encoded (not the raw bcrypt string)
                  hashed = bcrypt.hashpw(local_pass.encode('utf-8'),
                                         bcrypt.gensalt(12))
                  encoded = base64.b64encode(hashed).decode('utf-8')
                  ha_auth = {
                      'version': 1,
                      'minor_version': 1,
                      'key': 'auth_provider.homeassistant',
                      'data': {
                          'users': [{'username': local_user, 'password': encoded}],
                      },
                  }
                  with open('/config/.storage/auth_provider.homeassistant', 'w') as f:
                      json.dump(ha_auth, f)

                  # Link the credential to the admin user
                  auth['data']['credentials'].append({
                      'id': uuid.uuid4().hex,
                      'user_id': admin_id,
                      'auth_provider_type': 'homeassistant',
                      'auth_provider_id': None,
                      'data': {'username': local_user},
                  })
                  print(f'Local credential created: username={local_user}')
              else:
                  print('No HA_LOCAL_PASSWORD — skipping local credential (OIDC-only)')

              # Generate a Long-Lived Access Token for the mobile app.
              # The HA iOS/Android app can't handle OIDC SSO, so we pre-create
              # an LLT that can be pasted into the app once.
              import secrets as sec
              import jwt as pyjwt
              from datetime import datetime, timezone

              rt_id = uuid.uuid4().hex
              jwt_key = sec.token_hex(64)
              now = datetime.now(timezone.utc)

              auth['data']['refresh_tokens'].append({
                  'id': rt_id,
                  'user_id': admin_id,
                  'client_id': None,
                  'client_name': 'Mobile App (auto-generated)',
                  'client_icon': None,
                  'token_type': 'long_lived_access_token',
                  'created_at': now.isoformat(),
                  'access_token_expiration': 1800.0,
                  'token': sec.token_hex(64),
                  'jwt_key': jwt_key,
                  'last_used_at': None,
                  'last_used_ip': None,
                  'expire_at': None,
                  'credential_id': None,
                  'version': '2025.4.2',
              })

              # Compute the JWT
              llt = pyjwt.encode({
                  'iss': rt_id,
                  'iat': int(now.timestamp()),
                  'exp': int(now.timestamp()) + (10 * 365 * 24 * 3600),
              }, jwt_key, algorithm='HS256')

              # Write the LLT to a file for easy retrieval
              with open('/config/.mobile-token', 'w') as f:
                  f.write(llt)
              print(f'Mobile app LLT generated → /config/.mobile-token')

              with open('/config/.storage/auth', 'w') as f:
                  json.dump(auth, f)
              print(f'Auth file created — admin user id={admin_id[:8]}...')
              PYEOF
                echo "Onboarding pre-seeded — wizard will be skipped"
              else
                echo "Onboarding already completed"
              fi

              # 3. Create themes directory if missing (HA expects it)
              mkdir -p /config/themes

              # 4. Copy GitOps-managed configs from ConfigMap to PVC
              # (Can't use subPath mounts — they're read-only and prevent
              # runtime patching of placeholders)
              for f in configuration.yaml automations.yaml scripts.yaml scenes.yaml; do
                if [ -f "/config-templates/${f}" ]; then
                  cp "/config-templates/${f}" "/config/${f}"
                fi
              done

              # 5. Patch OIDC placeholders in configuration.yaml
              # The ConfigMap has HA_OIDC_CLIENT_ID and DOMAIN as placeholders.
              # The ha-oidc-config Secret (created by bootstrap) provides the real values.
              if [ -n "${HA_OIDC_CLIENT_ID:-}" ] && [ -n "${HA_DOMAIN:-}" ]; then
                sed -i "s/HA_OIDC_CLIENT_ID/${HA_OIDC_CLIENT_ID}/g" /config/configuration.yaml
                sed -i "s/HA_OIDC_CLIENT_SECRET/${HA_OIDC_CLIENT_SECRET:-none}/g" /config/configuration.yaml
                sed -i "s/auth\.DOMAIN/auth.${HA_DOMAIN}/g" /config/configuration.yaml
                echo "OIDC config patched: client_id=${HA_OIDC_CLIENT_ID}, domain=${HA_DOMAIN}"
              else
                echo "WARN: ha-oidc-config secret not found — OIDC SSO will not work"
                echo "Run bootstrap or create the secret manually:"
                echo "  kubectl -n home-assistant create secret generic ha-oidc-config \\"
                echo "    --from-literal=client-id=<zitadel-client-id> \\"
                echo "    --from-literal=domain=kubew.dev"
              fi

              echo "Init complete"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-yaml
              mountPath: /config-templates

      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2025.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: usb
              mountPath: /dev/bus/usb
            - name: ttyusb
              mountPath: /dev/ttyUSB0
            - name: ttyacm
              mountPath: /dev/ttyACM0
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: config-yaml
          configMap:
            name: home-assistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: usb
          hostPath:
            path: /dev/bus/usb
        - name: ttyusb
          hostPath:
            path: /dev/ttyUSB0
            type: ""
        - name: ttyacm
          hostPath:
            path: /dev/ttyACM0
            type: ""

      tolerations:
        - key: "iot-only"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
spec:
  type: ClusterIP
  ports:
    - port: 8123
      targetPort: 8123
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: home-assistant
