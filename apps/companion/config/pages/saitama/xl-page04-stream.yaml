# Saitama — Stream Deck XL Page 43: Stream / Recording Control
# 8x4 = 32 buttons
#
# Dedicated streaming/recording page with full scene control,
# source toggles, and future Blackmagic recorder integration.
#
# Row 0: OBS status + stream/record info
# Row 1: All OBS scenes
# Row 2: Source toggles + transitions
# Row 3: Stream/Record controls + recorder slot + nav

page:
  number: 43
  name: "Stream"
  device: xl

buttons:
  # ═══ Row 0: Status ═══
  - row: 0
    col: 0
    style:
      text: "OBS"
      bgcolor: "#991111"
      size: 14
    feedbacks:
      - type: obs:connected
        style:
          bgcolor: "#116611"
          text: "OBS\n● OK"

  - row: 0
    col: 1
    style:
      text: "ATEM"
      bgcolor: "#991111"
      size: 14
    feedbacks:
      - type: atem:connected
        style:
          bgcolor: "#116611"
          text: "ATEM\n● OK"

  - row: 0
    col: 2
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 0
    col: 3
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 0
    col: 4
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 0
    col: 5
    style:
      text: ""
      bgcolor: "#1A1A1A"

  # Reserved for Blackmagic recorder status
  - row: 0
    col: 6
    style:
      text: "Recorder"
      bgcolor: "#333333"
      size: 12

  - row: 0
    col: 7
    style:
      text: "$(internal:time_hms)"
      bgcolor: "#222222"
      size: 18

  # ═══ Row 1: OBS scenes (expanded) ═══
  - row: 1
    col: 0
    style:
      text: "Main"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Main" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Main" }
        style:
          bgcolor: "#00AA00"
          text: "● Main"

  - row: 1
    col: 1
    style:
      text: "Camera"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Camera" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Camera" }
        style:
          bgcolor: "#00AA00"
          text: "● Cam"

  - row: 1
    col: 2
    style:
      text: "Slides"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Slides" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Slides" }
        style:
          bgcolor: "#00AA00"
          text: "● Slides"

  - row: 1
    col: 3
    style:
      text: "PiP"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "PiP" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "PiP" }
        style:
          bgcolor: "#00AA00"
          text: "● PiP"

  - row: 1
    col: 4
    style:
      text: "Wide"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Wide" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Wide" }
        style:
          bgcolor: "#00AA00"
          text: "● Wide"

  - row: 1
    col: 5
    style:
      text: "Intro"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Intro" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Intro" }
        style:
          bgcolor: "#00AA00"
          text: "● Intro"

  - row: 1
    col: 6
    style:
      text: "Outro"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Outro" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Outro" }
        style:
          bgcolor: "#00AA00"
          text: "● Outro"

  - row: 1
    col: 7
    style:
      text: "BRB"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "BRB" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "BRB" }
        style:
          bgcolor: "#00AA00"
          text: "● BRB"

  # ═══ Row 2: Transitions + source toggles ═══
  - row: 2
    col: 0
    style:
      text: "AUTO"
      bgcolor: "#AAAA00"
      size: 18
    actions:
      down:
        - action: atem:auto_transition

  - row: 2
    col: 1
    style:
      text: "CUT"
      bgcolor: "#AAAA00"
      size: 18
    actions:
      down:
        - action: atem:cut_transition

  - row: 2
    col: 2
    style:
      text: "FTB"
      bgcolor: "#333333"
      size: 18
    actions:
      down:
        - action: atem:toggle_ftb
    feedbacks:
      - type: atem:ftb_active
        style:
          bgcolor: "#CC0000"
          text: "● FTB"

  - row: 2
    col: 3
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 2
    col: 4
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 2
    col: 5
    style:
      text: ""
      bgcolor: "#1A1A1A"

  # Reserved for Blackmagic recorder
  - row: 2
    col: 6
    style:
      text: "REC\n(BM)"
      bgcolor: "#333333"
      size: 14

  - row: 2
    col: 7
    style:
      text: "STOP\n(BM)"
      bgcolor: "#333333"
      size: 14

  # ═══ Row 3: Stream/Record controls + nav ═══
  - row: 3
    col: 0
    style:
      text: "STREAM\nStart"
      bgcolor: "#006600"
      size: 14
    actions:
      down:
        - action: obs:toggle_streaming
    feedbacks:
      - type: obs:streaming
        style:
          bgcolor: "#CC0000"
          text: "● LIVE\nStop?"

  - row: 3
    col: 1
    style:
      text: "REC\nStart"
      bgcolor: "#006600"
      size: 14
    actions:
      down:
        - action: obs:toggle_recording
    feedbacks:
      - type: obs:recording
        style:
          bgcolor: "#CC0000"
          text: "● REC\nStop?"

  - row: 3
    col: 2
    style:
      text: "Audio\nREC"
      bgcolor: "#444444"
      size: 14

  - row: 3
    col: 3
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 3
    col: 4
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 3
    col: 5
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 3
    col: 6
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 3
    col: 7
    style:
      text: "← Home"
      bgcolor: "#003366"
      size: 14
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 40 }
