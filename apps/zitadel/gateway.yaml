# Zitadel HTTPRoute via Gateway API
#
# Routes all traffic to the main Zitadel service (port 8080) which
# handles both the API (OIDC, management, gRPC) and the login UI.
# In Zitadel v4.x, the main server serves the login UI at /ui/login
# and redirects the root path there automatically.
#
# The separate zitadel-login service (Next.js on port 3000) exists in
# the Helm chart but the main API handles login flows internally.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: zitadel
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/part-of: kube-world
spec:
  parentRefs:
    - name: kube-world-gateway
      namespace: kube-system
  hostnames:
    - "auth.kubew.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zitadel
          port: 8080
