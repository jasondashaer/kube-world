# Flux Kustomization for Renovate CronJob
# Deploys to central cluster alongside GitLab.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/renovate
  prune: true
  sourceRef:
    kind: GitRepository
    name: kube-world
  timeout: 5m
