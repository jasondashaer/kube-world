# Home Assistant HTTPRoute via Gateway API
# Routes external traffic to Home Assistant on port 8123
#
# Uses Gateway API instead of legacy Ingress for portability.
# TLS handled by the shared Gateway resource + cert-manager.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
spec:
  parentRefs:
    - name: kube-world-gateway
      namespace: kube-system
  hostnames:
    - "ha.kubew.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: home-assistant
          port: 8123
