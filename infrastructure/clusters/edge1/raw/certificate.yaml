# Wildcard TLS certificate for *.edge1.kubew.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-wildcard
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: kube-world
spec:
  secretName: kube-world-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # The second SAN (internal.edge1.kubew.dev) serves two purposes:
  #   1. Creates a new LE rate limit bucket (different identifier set)
  #   2. Uses a different TXT record than the wildcard, avoiding the
  #      cert-manager concurrent challenge race condition
  # Can be removed once the old *.edge1.kubew.dev bucket fully clears (~Apr 17)
  dnsNames:
    - "*.edge1.kubew.dev"
    - "internal.edge1.kubew.dev"
