# YIBC — Stream Deck+ Page 22: Ops (Startup / Shutdown)
# Plus reports as 4 rows × 4 cols.
#   Rows 0-1: physical buttons (2×4 = 8 keys)
#   Row 2: LCD strip (4 zones, pressable)
#   Row 3: rotary encoders
#
# Layout:
#   Row 0: [STARTUP] [        ] [        ] [        ]
#   Row 1: [SHUTDOWN] [        ] [        ] [        ]
#   LCD:   [        ] [        ] [        ] [PAGE ►]
#   Knobs: [        ] [        ] [        ] [PAGE]
#
# Encoder E3 PAGE: rotate_cw advances forward (22→20→21→22…),
# rotate_ccw goes backward (22→21→20→22…). Press returns to PTZ (page 20).
#
# Startup action chain:
#   1) TV power_on
#   2) wait, then attempt HDMI 2 via KEYCODE_TV_INPUT_HDMI_2 (may not
#      work on this Mediatek firmware — fallback path commented below).
#   3) Sonos: set volume to 35 — TODO verify action id (placeholder
#      `set_volume` with `volume: 35`). Sonos-speakers v1.1.0 obfuscates
#      action defs; re-probe live module after deploy via tRPC
#      definitions.actions.list, adjust if needed.
#
# Shutdown action chain:
#   1) ProPresenter clearall (wipe slide+audio)
#   2) TV power_off
#   3) Sonos: no power state (Beam is always-on appliance). Best we can
#      do is mute via SetMute — TODO verify action id (placeholder
#      `mute`). The Beam will idle once TV is off.

page:
  number: 22
  name: "Ops"
  device: plus

buttons:
  # ═══ Row 0: Startup ═══
  - row: 0
    col: 0
    style:
      text: "STARTUP\n起動"
      bgcolor: "#117711"
      color: "#FFFFFF"
      size: 14
    actions:
      down:
        # 1) TV ON
        - action: tv_yibc:power
          options: { power: "power_on" }
        # 2) Wait for TV boot (Philips ~6s to be input-responsive)
        - action: internal:wait
          options: { time: "6000" }
        # 3) HDMI input switch removed 2026-05-24. Investigation:
        # `KEYCODE_TV_INPUT_HDMI_1` and `_HDMI_2` are silently
        # ignored on this Mediatek/KTC firmware over the Remote-v2
        # protocol (verified live). `KEYCODE_TV_INPUT` does open the
        # picker, but the picker order/contents are dynamic (hidden
        # when nothing is plugged, CEC labels shift), so a fixed
        # DPAD-navigate sequence is fragile. CEC is unavailable
        # because the Pi reaches the TV over Ethernet only — no
        # HDMI cable. ADB/tv-bridge path needs Wi-Fi-gated Wireless
        # debugging pairing, blocked by the same Ethernet-only
        # constraint. Net: TV remembers last input across power
        # cycles, so this is usually a no-op anyway; if it's on the
        # wrong input post-startup, operator switches manually.
        # 4) Sonos volume → 35
        - action: sonos_yibc:set_volume
          options: { volume: 35 }

  # ═══ Row 1: Shutdown ═══
  - row: 1
    col: 0
    style:
      text: "SHUTDOWN\n終了"
      bgcolor: "#771111"
      color: "#FFFFFF"
      size: 14
    actions:
      down:
        # 1) PP clear
        - action: propresenter_yibc:clearall
        # 2) TV OFF
        - action: tv_yibc:power
          options: { power: "power_off" }
        # 3) Sonos mute (Beam has no power; muting silences ARC)
        - action: sonos_yibc:mute
          options: { mute: true }

  # ═══ Row 2: LCD strip ═══
  # Col 3: press advances to next page (22 → 20).
  - row: 2
    col: 3
    style:
      text: "PAGE ►"
      bgcolor: "#222222"
      size: 14
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 20 }

encoders:
  # E3: PAGE — circular nav across Plus pages 20/21/22.
  # CW (forward):  22 → 20
  # CCW (back):    22 → 21
  # Press: jump to PTZ (page 20, home).
  - encoder: 3
    style:
      text: "PAGE"
      size: 14
    actions:
      rotate_cw:
        - action: internal:set_page
          options: { controller: "self", page: 20 }
      rotate_ccw:
        - action: internal:set_page
          options: { controller: "self", page: 21 }
      down:
        - action: internal:set_page
          options: { controller: "self", page: 20 }
