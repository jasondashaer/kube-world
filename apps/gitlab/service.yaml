# GitLab CE Service Endpoint for Kubernetes
#
# GitLab runs natively on the Pi host (systemd) because the official
# gitlab/gitlab-ce Docker image is amd64-only. This Service + Endpoints
# pair makes the native GitLab reachable from within the K8s cluster.
#
# When the central node upgrades to amd64 server hardware, replace this
# with the full K8s deployment (see deployment.yaml.amd64-future).
#
# GitLab listens on the host at:
#   - HTTP: port 80 (external_url: http://gitlab.<PI_IP>.nip.io)
#   - SSH:  port 22
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/part-of: kube-world
subsets:
  - addresses:
      # Host IP — the Pi node running GitLab natively
      # This is the K8s node's internal IP, not an external one
      - ip: "10.5.5.249"
    ports:
      - name: http
        port: 80
        protocol: TCP
      - name: ssh
        port: 22
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/part-of: kube-world
spec:
  # No selector — manually managed Endpoints above
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
