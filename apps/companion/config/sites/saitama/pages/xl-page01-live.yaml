# Saitama — Stream Deck XL Page 1: Live (new streamlined main page)
#
# Drafted 2026-05-29. Lives alongside the existing pages 40-44 (Home,
# Audio, ProP, Stream, Segments) which stay untouched — page 1 is
# parallel for testing. The XL's startup_page stays at 40 in
# surfaces.yaml until this page is signed off; operator can navigate
# manually to page 1 to test.
#
# Design intent: cut complexity from the original 5-page layout.
# - All Yamaha scene recalls except the boot Startup chain dropped
#   (TF1 has no scene-safe, so per-segment recalls clobber the live
#   board)
# - Audio, ProP, Stream, Segments page navs removed from this page —
#   if needed, operator navigates directly on the deck
# - GO LIVE chain only starts RECORD (not stream); STREAM stays a
#   dedicated manual toggle until the chain is trusted in production
# - END SVC chain uses ATEM FTB instead of PP clear_all + master mute,
#   so the in-room display + house audio continue uninterrupted
#
# Grid: 8 cols × 4 rows. 17 cells active, 15 empty (breathing room).
#
# Layout:
#   Row 0: [ProP]    [ATEM]   [Yam]    [Bridge] [_] [_] [Service:_] [time_hms]
#   Row 1: [_]       [REC●]   [STREAM●][FTB]    [_] [_] [_]         [DUCK]
#   Row 2: [GO LIVE] [REC arm][STR arm][FTB arm][_] [_] [_]         [MUTE M]
#   Row 3: [END SVC] [_]      [_]      [_]      [CLEAR PP] [PREV] [GO/NEXT] [_]
#
# ARM toggles (r2c1-c3) gate inclusion of REC / STREAM / FTB in the
# GO LIVE + END SVC chains. The chains themselves are implemented as
# triggers in triggers.yaml — GO LIVE / END SVC buttons just set a
# pulse variable that the triggers watch. Each trigger gates one
# slice on the corresponding arm_<action> variable. The earlier
# `internal:if_expression` approach was abandoned because Companion
# 4.3.1 doesn't remap child entity connectionIds during import.
# Trigger top-level actions DO get remapped, so this works.
#
# Right column = audio safety stack, escalating top → bottom:
#   r1c7 DUCK   — master fader -20 dB toggle for talk-over
#   r2c7 MUTE M — master fader On toggle
#   r3c7 PANIC  — master fader → -∞ instant (emergency hard cut)

page:
  number: 1
  name: "Live"
  device: xl

buttons:
  # ═══════════════════════════════════════════════════════════════════
  # Row 0: Status indicators + service mode + clock
  # ═══════════════════════════════════════════════════════════════════

  # Status pads use the proven internal:variable_value pattern (same as
  # page 40). Companion 4.3.1's internal:instance_status feedback
  # didn't render on Saitama in testing — the variable_value form is
  # what the existing page-40 indicators use, so we mirror that. Two
  # feedbacks per pad: one green when connection is "good", one red
  # when "error". Base style (gray) shows during init / disabled.
  - row: 0
    col: 0
    style:
      text: "ProP\n● ?"
      bgcolor: "#222222"
      color: "#888888"
      size: 14
      alignment: "center:center"
      show_topbar: "default"
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "internal:connection_ProPresenter__Saitama__status"
          op: "eq"
          value: "good"
        style:
          text: "ProP\n● OK"
          size: 14
          color: 16777215
          bgcolor: 1140241        # 0x116811 dark green
          alignment: "center:center"
          show_topbar: "default"
      - type: internal:variable_value
        options:
          variable: "internal:connection_ProPresenter__Saitama__status"
          op: "eq"
          value: "error"
        style:
          text: "ProP\n● OFFLINE"
          size: 14
          color: 16777215
          bgcolor: 13107200       # 0xC80000 red
          alignment: "center:center"
          show_topbar: "default"

  - row: 0
    col: 1
    style:
      text: "ATEM\n● ?"
      bgcolor: "#222222"
      color: "#888888"
      size: 14
      alignment: "center:center"
      show_topbar: "default"
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "internal:connection_ATEM_Mini_Pro__Saitama__status"
          op: "eq"
          value: "good"
        style:
          text: "ATEM\n● OK"
          size: 14
          color: 16777215
          bgcolor: 1140241
          alignment: "center:center"
          show_topbar: "default"
      - type: internal:variable_value
        options:
          variable: "internal:connection_ATEM_Mini_Pro__Saitama__status"
          op: "eq"
          value: "error"
        style:
          text: "ATEM\n● OFFLINE"
          size: 14
          color: 16777215
          bgcolor: 13107200
          alignment: "center:center"
          show_topbar: "default"

  - row: 0
    col: 2
    style:
      text: "Yamaha\n● ?"
      bgcolor: "#222222"
      color: "#888888"
      size: 14
      alignment: "center:center"
      show_topbar: "default"
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "internal:connection_Yamaha_TF1__Saitama__status"
          op: "eq"
          value: "good"
        style:
          text: "Yamaha\n● OK"
          size: 14
          color: 16777215
          bgcolor: 1140241
          alignment: "center:center"
          show_topbar: "default"
      - type: internal:variable_value
        options:
          variable: "internal:connection_Yamaha_TF1__Saitama__status"
          op: "eq"
          value: "error"
        style:
          text: "Yamaha\n● OFFLINE"
          size: 14
          color: 16777215
          bgcolor: 13107200
          alignment: "center:center"
          show_topbar: "default"

  - row: 0
    col: 3
    style:
      text: "Bridge\n● ?"
      bgcolor: "#222222"
      color: "#888888"
      size: 14
      alignment: "center:center"
      show_topbar: "default"
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "internal:connection_ATEM_Media_Bridge__local__status"
          op: "eq"
          value: "good"
        style:
          text: "Bridge\n● OK"
          size: 14
          color: 16777215
          bgcolor: 1140241
          alignment: "center:center"
          show_topbar: "default"
      - type: internal:variable_value
        options:
          variable: "internal:connection_ATEM_Media_Bridge__local__status"
          op: "eq"
          value: "error"
        style:
          text: "Bridge\n● OFFLINE"
          size: 14
          color: 16777215
          bgcolor: 13107200
          alignment: "center:center"
          show_topbar: "default"

  # Service mode pad — text reads the custom variable; green-bg
  # feedback fires when value == "Live" so the operator sees go/no-go
  # at a glance.
  - row: 0
    col: 6
    style:
      text: "Service:\n$(internal:custom_service_mode)"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 14
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "custom:service_mode"
          op: "eq"
          value: "Live"
        style:
          bgcolor: "#118800"
          color: "#FFFFFF"
          text: "Service:\nLIVE"
          size: 14

  - row: 0
    col: 7
    style:
      text: "$(internal:time_hms)"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 18

  # ═══════════════════════════════════════════════════════════════════
  # Row 1: Service start + video controls + PP slide nav + DUCK
  # ═══════════════════════════════════════════════════════════════════

  # GO LIVE — pulse-only button. Sets `go_live_pulse = "1"` which
  # fires the GO LIVE triggers in triggers.yaml; each trigger
  # implements one slice of the chain with its own arm condition
  # (arm_rec / arm_stream / arm_ftb). After 100 ms the pulse is
  # reset to "0" so the next press fires the rising edge again.
  # service_mode = "Live" is set by the final trigger after the
  # camera-fade reveal completes.
  - row: 2
    col: 0
    style:
      text: "GO\nLIVE"
      bgcolor: "#117711"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: internal:custom_variable_set_value
          options: { name: "go_live_pulse", value: "1" }
        - action: internal:wait
          options: { time: "100" }
        - action: internal:custom_variable_set_value
          options: { name: "go_live_pulse", value: "0" }

  # ARM REC — 2-step toggle. Step 0 = disarmed (gray "REC OFF"),
  # step 1 = armed (green "REC ARMED" via feedback). Sets `arm_rec`
  # custom variable that gates the GO LIVE + END SVC REC triggers.
  - row: 2
    col: 1
    style:
      text: "REC\nOFF"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 18
    steps:
      - actions:
          down:
            - action: internal:custom_variable_set_value
              options: { name: "arm_rec", value: "1" }
            - action: internal:step_delta
              options: { amount: 1 }
      - actions:
          down:
            - action: internal:custom_variable_set_value
              options: { name: "arm_rec", value: "0" }
            - action: internal:step_delta
              options: { amount: 1 }
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "custom:arm_rec"
          op: "eq"
          value: "1"
        style:
          text: "REC\nARMED"
          bgcolor: "#117711"
          color: "#FFFFFF"
          size: 18
          alignment: "center:center"
          show_topbar: "default"

  # ARM STREAM — same pattern as ARM REC. Gates the stream slice.
  - row: 2
    col: 2
    style:
      text: "STREAM\nOFF"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 14
    steps:
      - actions:
          down:
            - action: internal:custom_variable_set_value
              options: { name: "arm_stream", value: "1" }
            - action: internal:step_delta
              options: { amount: 1 }
      - actions:
          down:
            - action: internal:custom_variable_set_value
              options: { name: "arm_stream", value: "0" }
            - action: internal:step_delta
              options: { amount: 1 }
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "custom:arm_stream"
          op: "eq"
          value: "1"
        style:
          text: "STREAM\nARMED"
          bgcolor: "#117711"
          color: "#FFFFFF"
          size: 14
          alignment: "center:center"
          show_topbar: "default"

  # ARM FTB — same pattern as ARM REC. Gates the two FTB slices
  # (ON pre-roll + OFF after rec/stream start) in GO LIVE, and the
  # FTB-ON slice in END SVC.
  - row: 2
    col: 3
    style:
      text: "FTB\nOFF"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 18
    steps:
      - actions:
          down:
            - action: internal:custom_variable_set_value
              options: { name: "arm_ftb", value: "1" }
            - action: internal:step_delta
              options: { amount: 1 }
      - actions:
          down:
            - action: internal:custom_variable_set_value
              options: { name: "arm_ftb", value: "0" }
            - action: internal:step_delta
              options: { amount: 1 }
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "custom:arm_ftb"
          op: "eq"
          value: "1"
        style:
          text: "FTB\nARMED"
          bgcolor: "#117711"
          color: "#FFFFFF"
          size: 18
          alignment: "center:center"
          show_topbar: "default"

  # REC — dedicated record toggle. Red feedback when active.
  - row: 1
    col: 1
    style:
      text: "REC"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: atem_saitama:recordStartStop
          options: { record: "toggle" }
    feedbacks:
      - type: bmd-atem:recording
        options: {}
        style:
          bgcolor: "#C80000"
          color: "#FFFFFF"
          text: "REC ●"
          size: 18

  # STREAM — dedicated stream toggle. Red feedback when active.
  - row: 1
    col: 2
    style:
      text: "STREAM"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 14
    actions:
      down:
        - action: atem_saitama:streamStartStop
          options: { stream: "toggle" }
    feedbacks:
      - type: bmd-atem:streaming
        options: {}
        style:
          bgcolor: "#C80000"
          color: "#FFFFFF"
          text: "STREAM ●"
          size: 14

  # FTB — ATEM Fade To Black. Single press toggles black on/off.
  - row: 1
    col: 3
    style:
      text: "FTB"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: atem_saitama:fadeToBlackAuto
          options: { mixeffect: 0 }

  # CLEAR PP — clears the slide layer. PP-API module has no
  # single "clear all" action; clearLayerOrGroup hits one layer at
  # a time. "slide" is the most common need. Add more entries to
  # the action chain for additional layers (e.g. messages, props).
  - row: 3
    col: 4
    style:
      text: "CLEAR\nPP"
      bgcolor: "#664400"
      color: "#FFFFFF"
      size: 16
    actions:
      down:
        - action: propresenter_saitama:clearLayerOrGroup
          options:
            clear_layer_or_group_dropdown: "layer"
            clear_layer_dropdown: "slide"

  # PREV slide — PP-API uses unified `triggerOperation` action with
  # target + direction options (not separate prev_slide / next_slide).
  - row: 3
    col: 5
    style:
      text: "PREV"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: propresenter_saitama:triggerOperation
          options:
            trigger_target: "presentation"
            trigger_next_previous: "previous"

  # GO / NEXT — same triggerOperation action with direction=next.
  # Multi-line label so operator sees both common names without
  # ambiguity.
  - row: 3
    col: 6
    style:
      text: "GO\nNEXT"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: propresenter_saitama:triggerOperation
          options:
            trigger_target: "presentation"
            trigger_next_previous: "next"

  # DUCK — master fader -20 dB toggle implemented as a 2-step button.
  # Style lives at the button level (per-step style isn't supported
  # by the generator schema); visual ducked-state shown via feedback
  # on the duck_active variable. Each press fires the opposite
  # relative delta + advances to the other step, so restore matches
  # the dip even if the operator moved the master in between.
  #
  # Val units: yamaha-rcp upgrade script (runs on every import — the
  # generator doesn't pin lastUpgradeIndex) divides Val by 100. To
  # land at -20 dB / +20 dB in the live db, write raw pre-upgrade
  # units (-2000 / +2000) in YAML. Mirrors the convention used on
  # page 40 DUCK button which produces the working live values.
  - row: 1
    col: 7
    style:
      text: "DUCK"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 18
    steps:
      - actions:
          down:
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -2000, Rel: true }
            - action: internal:custom_variable_set_value
              options: { name: "duck_active", value: "1" }
            - action: internal:step_delta
              options: { amount: 1 }
      - actions:
          down:
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: 2000, Rel: true }
            - action: internal:custom_variable_set_value
              options: { name: "duck_active", value: "0" }
            - action: internal:step_delta
              options: { amount: 1 }
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "custom:duck_active"
          op: "eq"
          value: "1"
        style:
          text: "UNDUCK"
          bgcolor: "#CC7700"
          color: "#FFFFFF"
          size: 18
          alignment: "center:center"
          show_topbar: "default"

  # ═══════════════════════════════════════════════════════════════════
  # Row 2: END SVC + (breathing room) + MUTE M
  # ═══════════════════════════════════════════════════════════════════

  # END SVC — pulse-only button. Same pattern as GO LIVE: sets
  # `end_svc_pulse = "1"` for 100 ms which fires the END SVC
  # triggers in triggers.yaml. Each trigger gates its slice on the
  # same arm_<action> variables as GO LIVE — operator picks once
  # per service which actions are part of the flow.
  - row: 3
    col: 0
    style:
      text: "END\nSVC"
      bgcolor: "#771111"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: internal:custom_variable_set_value
          options: { name: "end_svc_pulse", value: "1" }
        - action: internal:wait
          options: { time: "100" }
        - action: internal:custom_variable_set_value
          options: { name: "end_svc_pulse", value: "0" }

  # MUTE M — master fader On toggle. TF1 inverted Val logic: 1 =
  # unmuted, 0 = muted, "Toggle" flips. Base bgcolor matches the
  # old PANIC dark red so the audio-safety stack reads as a single
  # red column at a glance.
  - row: 2
    col: 7
    style:
      text: "MUTE\nMaster"
      bgcolor: "#660000"
      color: "#FFFFFF"
      size: 14
    actions:
      down:
        - action: yamaha_saitama:MIXER_Current/St/Fader/On
          options: { X: 1, Val: "Toggle" }
    feedbacks:
      - type: internal:variable_value
        options:
          variable: "Yamaha_TF1__Saitama_:MIXER_Current/St/Fader/On_1"
          op: "eq"
          value: "0"
        style:
          bgcolor: "#C80000"
          color: "#FFFFFF"
          text: "MUTED"
          size: 14

  # PANIC removed 2026-05-31 — operator prefers a single audio kill
  # switch (MUTE Master) rather than two adjacent destructive
  # actions. To re-add an instant-to-minus-infinity action, restore
  # the row 3 col 7 button with
  # `yamaha_saitama:MIXER_Current/St/Fader/Level X:1 Val:-32768`.
