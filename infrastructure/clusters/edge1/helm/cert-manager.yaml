# cert-manager on pi-edge-1 — standalone (not a Rancher dependency).
# Handles TLS certificate issuance via Let's Encrypt DNS-01 (Cloudflare).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-edge1
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  kubeConfig:
    secretRef:
      name: pi-edge-1-kubeconfig
  targetNamespace: cert-manager
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
