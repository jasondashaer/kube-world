  # ───── SERVICE-CLOSE PAIR ─────
  # Two-button workflow for service close. The first stages the close
  # (snapshot levels → fade music down → start Spotify playlist → fade
  # music up to a "talking under music" level). The second concludes
  # (fade music to fixed final level → trigger PP closing graphic →
  # 12s hold → fade record bus to -∞ → stop stream + recording, leaving
  # the room music at the talking-under level).

  # SVC CLOSE 1 — Start the close flow (begin underscore music)
  - row: 2
    col: 2
    style:
      text: "CLOSE 1\nStart"
      bgcolor: "#003366"
      color: "#FFFFFF"
      size: 11
    actions:
      down:
        # Snapshot current master + record bus levels for restore
        - action: internal:custom_variable_set_expression
          options:
            name: "pre_close_master_level"
            expression: "0"
        - action: internal:custom_variable_set_expression
          options:
            name: "pre_close_mix_level"
            expression: "$(internal:custom_record_bus_idx) * 0"
        - action: internal:custom_variable_set_value
          options: { name: "close_stage", value: "Closing-Underscore" }
        # 10-step master fade to -∞ over ~500ms
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -800 }
        - action: internal:wait
          options: { time: "50" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -1500 }
        - action: internal:wait
          options: { time: "50" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -2300 }
        - action: internal:wait
          options: { time: "50" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -3200 }
        - action: internal:wait
          options: { time: "50" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -32768 }
        # Start Spotify playlist + track. URI placeholder — operator
        # configures which playlist via the Spotify connection.
        - action: spotify_yibc:playPlaylist
          options:
            uri: "spotify:playlist:PLACEHOLDER_PLAYLIST_URI"
        - action: internal:wait
          options: { time: "1500" }
        # 30-step slow fade up to -10dB ("under-talking" level) over 6s
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -3000 }
        - action: internal:wait
          options: { time: "200" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -2700 }
        - action: internal:wait
          options: { time: "200" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -2400 }
        - action: internal:wait
          options: { time: "200" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -2100 }
        - action: internal:wait
          options: { time: "200" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -1800 }
        - action: internal:wait
          options: { time: "200" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -1500 }
        - action: internal:wait
          options: { time: "200" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -1200 }
        - action: internal:wait
          options: { time: "200" }
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options: { X: 1, Val: -1000 }

  # SVC CLOSE 2 — Finish the close flow (graphic → fade record → stop)
  - row: 2
    col: 3
    style:
      text: "CLOSE 2\nFinish"
      bgcolor: "#660033"
      color: "#FFFFFF"
      size: 11
    actions:
      down:
        # Fade master up to closing target (-3dB by default)
        - action: yamaha_yibc:MIXER_Current/St/Fader/Level
          options:
            X: 1
            Val: "$(internal:custom_closing_target_db_units)"
        # Fire PP closing graphic (Pro7 macro UUID — TBD)
        - action: propresenter_yibc:pro7TriggerMacro
          options:
            pro7MacroUUID: "PLACEHOLDER_CLOSING_GRAPHIC_MACRO"
        # Hold graphic on the stream/recording for 12 seconds
        - action: internal:wait
          options: { time: "12000" }
        # Fade record bus to -∞ (recording goes silent first)
        - action: yamaha_yibc:MIXER_Current/Mix/Fader/Level
          options:
            X: "$(internal:custom_record_bus_idx)"
            Val: -800
        - action: internal:wait
          options: { time: "100" }
        - action: yamaha_yibc:MIXER_Current/Mix/Fader/Level
          options:
            X: "$(internal:custom_record_bus_idx)"
            Val: -1600
        - action: internal:wait
          options: { time: "100" }
        - action: yamaha_yibc:MIXER_Current/Mix/Fader/Level
          options:
            X: "$(internal:custom_record_bus_idx)"
            Val: -2400
        - action: internal:wait
          options: { time: "100" }
        - action: yamaha_yibc:MIXER_Current/Mix/Fader/Level
          options:
            X: "$(internal:custom_record_bus_idx)"
            Val: -32768
        # PP fade-to-black on stream/recording output
        - action: propresenter_yibc:clearall
        - action: internal:wait
          options: { time: "800" }
        # Stop stream + recording. Music in the room stays up.
        - action: obs_yibc:stop_recording
        - action: obs_yibc:stop_streaming
        - action: internal:custom_variable_set_value
          options: { name: "close_stage", value: "Stopped" }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Off" }

  # Navigate to segment-transition pad (page 31)
  - row: 2
    col: 4
    style:
      text: "SEGMENTS\n→"
      bgcolor: "#444444"
      color: "#FFFFFF"
      size: 12
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 31 }
