# Flux Kustomization for the Entra group -> HA role sync webhook.
# Deploys to the HOST cluster (central) in the zitadel namespace — the same
# cluster the Zitadel Actions v2 Target calls from.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel-groupsync
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/zitadel-groupsync
  prune: true
  sourceRef:
    kind: GitRepository
    name: kube-world
  # zitadel namespace is created at bootstrap (identity HelmReleases are applied
  # imperatively, not as a Flux Kustomization — so no dependsOn to wait on).
  # No kubeConfig → applies to host (central) cluster
  timeout: 10m
