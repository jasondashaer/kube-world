# YIBC — Stream Deck MK2 Page 30: Operations
# 5x3 grid — testing ProPresenter + Yamaha TF5 control

page:
  number: 30
  name: "Ops"
  device: mk2  # 5x3 = 15 buttons

buttons:
  # ═══ Row 0: Stream control (unchanged) ═══
  - row: 0
    col: 0
    style:
      text: "STREAM"
      bgcolor: "#555555"
      size: 14
    actions:
      down:
        - action: obs:toggle_streaming
    feedbacks:
      - type: obs:streaming
        style:
          bgcolor: "#CC0000"
          text: "● LIVE"

  - row: 0
    col: 1
    style:
      text: "REC"
      bgcolor: "#555555"
      size: 14
    actions:
      down:
        - action: obs:toggle_recording
    feedbacks:
      - type: obs:recording
        style:
          bgcolor: "#CC0000"
          text: "● REC"

  - row: 0
    col: 2
    style:
      text: "Main"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Main" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Main" }
        style:
          bgcolor: "#00AA00"
          text: "● Main"

  - row: 0
    col: 3
    style:
      text: "Camera"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Camera" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Camera" }
        style:
          bgcolor: "#00AA00"
          text: "● Cam"

  - row: 0
    col: 4
    style:
      text: "JST\n$(internal:time_hms)"
      bgcolor: "#222222"
      size: 12

  # ═══ Row 1: ProPresenter test ═══
  - row: 1
    col: 0
    style:
      text: "PREV\nSlide"
      bgcolor: "#553300"
      size: 14
    actions:
      down:
        - action: propresenter_yibc:last

  - row: 1
    col: 1
    style:
      text: "NEXT\nSlide"
      bgcolor: "#553300"
      size: 14
    actions:
      down:
        - action: propresenter_yibc:next

  - row: 1
    col: 2
    style:
      text: "CLEAR\nAll"
      bgcolor: "#993300"
      size: 14
    actions:
      down:
        - action: propresenter_yibc:clearall

  # ARM button: starts the pre-service automation chain.
  # Press once to ARM (resets + starts PP timer 0, sets service_armed=1).
  # Press again to DISARM (stops timer, clears flag) — long-press also
  # available as panic abort.
  - row: 1
    col: 3
    style:
      text: "ARM\nService"
      bgcolor: "#1A1A1A"
      color: "#888888"
      size: 12
    steps:
      # Step 0: ARMED (red, shows armed state)
      - style:
          text: "ARM\nService"
          bgcolor: "#1A1A1A"
          color: "#888888"
          size: 12
        actions:
          down:
            - action: internal:custom_variable_set_value
              options: { name: "service_armed", value: "1" }
            - action: propresenter_yibc:clockReset
              options: { clockIndex: "0" }
            - action: propresenter_yibc:clockStart
              options: { clockIndex: "0" }
            - action: internal:custom_variable_set_value
              options: { name: "service_mode", value: "Armed" }
            - action: internal:step_delta
              options: { amount: 1 }
      # Step 1: DISARM (red bg = primed)
      - style:
          text: "DISARM\n$(ProPresenter__YIBC_:video_countdown_timer)"
          bgcolor: "#CC0000"
          color: "#FFFFFF"
          size: 11
        actions:
          down:
            - action: internal:custom_variable_set_value
              options: { name: "service_armed", value: "0" }
            - action: propresenter_yibc:clockStop
              options: { clockIndex: "0" }
            - action: internal:custom_variable_set_value
              options: { name: "service_mode", value: "Ready" }
            - action: internal:step_delta
              options: { amount: -1 }

  # Status pad: shows current service_mode + countdown when armed.
  - row: 1
    col: 4
    style:
      text: "$(internal:custom_service_mode)\n$(ProPresenter__YIBC_:video_countdown_timer)"
      bgcolor: "#222222"
      color: "#888888"
      size: 11

  # ═══ Row 2: Audio + nav ═══
  - row: 2
    col: 0
    style:
      text: "Master\nMute"
      bgcolor: "#444444"
      size: 12
    actions:
      down:
        - action: yamaha_yibc:MIXER_Current/St/Fader/On
          options: { X: 1, Val: "Toggle" }
        - action: yamaha_yibc:MIXER_Current/Mix/Fader/On
          options: { X: 17, Val: "Toggle" }
    feedbacks:
      - type: yamaha_yibc:MIXER_Current/St/Fader/On
        options: { X: 1, Val: 0 }
        style:
          bgcolor: "#CC0000"
          text: "MUTE"
          size: 14

