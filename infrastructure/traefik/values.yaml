# Traefik Ingress Controller - Pi-optimized values
# Deployed via Helm in the kube-system namespace
#
# Uses NodePort + hostPort for standard port access:
#   http://<pi-ip>:80   (hostPort) — primary access for kubew.dev domains
#   http://<pi-ip>:30080 (NodePort) — fallback
#   https://<pi-ip>:443  (hostPort)
#   https://<pi-ip>:30443 (NodePort)
#
# Gateway API routes traffic by hostname (e.g., gitlab.kubew.dev)
# to the appropriate backend service.

# Resource constraints for Pi 5
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Single replica (single-node cluster)
deployment:
  replicas: 1

# Ports configuration
ports:
  traefik:
    port: 9000
    expose:
      default: false
  web:
    port: 8000
    expose:
      default: true
    nodePort: 30080
    hostPort: 80
  websecure:
    port: 8443
    expose:
      default: true
    nodePort: 30443
    hostPort: 443

# NodePort service type
service:
  type: NodePort

# Access logs (lightweight)
logs:
  access:
    enabled: true
    format: json

# Dashboard (accessible via port-forward only)
ingressRoute:
  dashboard:
    enabled: false

# Providers
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: true

# Gateway API — Traefik auto-creates a GatewayClass.
# We manage our own Gateway resource in infrastructure/gateway/gateway.yaml
gateway:
  enabled: false
