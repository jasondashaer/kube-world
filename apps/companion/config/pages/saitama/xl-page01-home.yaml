# Saitama — Stream Deck XL Page 40: Home Dashboard
# 8x4 = 32 buttons

page:
  number: 40
  name: "Home"
  device: xl

buttons:
  # ═══ Row 0: Status bar ═══
  - row: 0
    col: 0
    style:
      text: "ATEM"
      bgcolor: "#991111"
      size: 14
    feedbacks:
      - type: atem:connected
        style:
          bgcolor: "#116611"
          text: "ATEM\n● OK"

  - row: 0
    col: 1
    style:
      text: "OBS"
      bgcolor: "#991111"
      size: 14
    feedbacks:
      - type: obs:connected
        style:
          bgcolor: "#116611"
          text: "OBS\n● OK"

  - row: 0
    col: 2
    style:
      text: "Audio\n音響"
      bgcolor: "#991111"
      size: 12
    feedbacks:
      - type: yamaha_saitama:connected
        style:
          bgcolor: "#116611"
          text: "Audio\n● OK"

  - row: 0
    col: 3
    style:
      text: "ProP"
      bgcolor: "#991111"
      size: 14
    feedbacks:
      - type: propresenter_saitama:connected
        style:
          bgcolor: "#116611"
          text: "ProP\n● OK"

  - row: 0
    col: 4
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 0
    col: 5
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 0
    col: 6
    style:
      text: "$(internal:custom_service_mode)"
      bgcolor: "#444444"
      size: 14

  - row: 0
    col: 7
    style:
      text: "$(internal:time_hms)"
      bgcolor: "#222222"
      size: 16

  # ═══ Row 1: Slides + Stream/Rec + Intro/Outro ═══
  - row: 1
    col: 0
    style:
      text: "PREV\n前へ"
      bgcolor: "#553300"
      size: 14
    actions:
      down:
        - action: propresenter_saitama:last

  - row: 1
    col: 1
    style:
      text: "NEXT\n次へ"
      bgcolor: "#553300"
      size: 14
    actions:
      down:
        - action: propresenter_saitama:next

  - row: 1
    col: 2
    style:
      text: "GO\n進む"
      bgcolor: "#00AA00"
      size: 18
    actions:
      down:
        - action: propresenter_saitama:next

  - row: 1
    col: 3
    style:
      text: "CLEAR\nクリア"
      bgcolor: "#664400"
      size: 12
    actions:
      down:
        - action: propresenter_saitama:clearslide

  - row: 1
    col: 4
    style:
      text: "STREAM\n配信"
      bgcolor: "#555555"
      size: 12
    actions:
      down:
        - action: obs:toggle_streaming
    feedbacks:
      - type: obs:streaming
        style:
          bgcolor: "#CC0000"
          text: "● LIVE\n配信中"

  - row: 1
    col: 5
    style:
      text: "REC\n録画"
      bgcolor: "#555555"
      size: 14
    actions:
      down:
        - action: obs:toggle_recording
    feedbacks:
      - type: obs:recording
        style:
          bgcolor: "#CC0000"
          text: "● REC\n録画中"

  - row: 1
    col: 6
    style:
      text: "Intro\nイントロ"
      bgcolor: "#004499"
      size: 12
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Intro" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Intro" }
        style:
          bgcolor: "#00AA00"
          text: "● Intro"

  - row: 1
    col: 7
    style:
      text: "Outro\nアウトロ"
      bgcolor: "#004499"
      size: 12
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Outro" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Outro" }
        style:
          bgcolor: "#00AA00"
          text: "● Outro"

  # ═══ Row 2: Timers + Scenes + Mute/Duck ═══
  - row: 2
    col: 0
    style:
      text: "Timer\n開始"
      bgcolor: "#006600"
      size: 12
    actions:
      down:
        - action: propresenter_saitama:clockStart
          options: { clockIndex: "0" }

  - row: 2
    col: 1
    style:
      text: "Timer\n停止"
      bgcolor: "#660000"
      size: 12
    actions:
      down:
        - action: propresenter_saitama:clockStop
          options: { clockIndex: "0" }

  - row: 2
    col: 2
    style:
      text: "Timer\nリセット"
      bgcolor: "#444444"
      size: 10
    actions:
      down:
        - action: propresenter_saitama:clockReset
          options: { clockIndex: "0" }

  # Worship → TF1 Bank A scene 2 (matches scenes/saitama/02-worship.yaml).
  # Bank A is engineer-owned working scenes; engineers can edit content
  # between services without touching this YAML. See scene-strategy.md.
  - row: 2
    col: 3
    style:
      text: "Worship\n賛美"
      bgcolor: "#664400"
      size: 10
    actions:
      down:
        - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
          options: { X: 2, Y: 1 }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Worship" }

  # Speaking (= Sermon) → TF1 Bank A scene 3
  # (matches scenes/saitama/03-sermon.yaml).
  - row: 2
    col: 4
    style:
      text: "Speaking\n説教"
      bgcolor: "#664400"
      size: 10
    actions:
      down:
        - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
          options: { X: 3, Y: 1 }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Sermon" }

  - row: 2
    col: 5
    style:
      text: "Pastor\nミュート"
      bgcolor: "#444444"
      size: 10
    actions:
      down:
        - action: yamaha_saitama:MIXER_Current/InCh/Fader/On
          options: { X: 11, Val: "Toggle" }
    feedbacks:
      - type: yamaha_saitama:MIXER_Current/InCh/Fader/On
        options: { X: 11, Val: 0 }
        style:
          bgcolor: "#CC0000"
          text: "MUTE\nミュート"
          size: 10

  - row: 2
    col: 6
    style:
      text: "Master\nミュート"
      bgcolor: "#444444"
      size: 10
    actions:
      down:
        - action: yamaha_saitama:MIXER_Current/St/Fader/On
          options: { X: 1, Val: "Toggle" }
    feedbacks:
      - type: yamaha_saitama:MIXER_Current/St/Fader/On
        options: { X: 1, Val: 0 }
        style:
          bgcolor: "#CC0000"
          text: "MUTE\nミュート"
          size: 10

  - row: 2
    col: 7
    style:
      text: "DUCK\nダック"
      bgcolor: "#664400"
      size: 12
    steps:
      - style:
          text: "DUCK\nダック"
          bgcolor: "#664400"
        actions:
          down:
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -500 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -1000 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -1500 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -2000 }
            - action: internal:step_delta
              options: { amount: 1 }
      - style:
          text: "UNDUCK\n戻す"
          bgcolor: "#CC6600"
        actions:
          down:
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -1500 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -1000 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -500 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: 0 }
            - action: internal:step_delta
              options: { amount: -1 }

  # ═══ Row 3: Service control row ═══
  # Layout intent: left half = service flow control (Startup → Preset →
  # Service Start → Shutdown). Right half = nav + PANIC safety.
  # ProP + Stream nav drop from row 3 — reach via Audio page nav row.
  #
  # Philosophy: Companion only references slots/indices/names. Operators
  # tune actual values in the integrated systems (PP timers, mixer
  # scenes, OBS scenes) without ever touching Companion UI.

  # ── Startup (generic) ──
  # Press once. Stages gear in a default "ready" state. Idempotent —
  # safe to press multiple times. Doesn't start any timer.
  - row: 3
    col: 0
    style:
      text: "Startup\n起動"
      bgcolor: "#006600"
      color: "#FFFFFF"
      size: 12
    actions:
      down:
        - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
          options: { X: 0, Y: 1 }            # scene 0 = Initial Data (quiet)
        - action: obs_saitama:set_current_scene
          options: { scene: "Pre-Service" }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Ready" }
        - action: internal:custom_variable_set_value
          options: { name: "active_service_preset", value: "none" }

  # ── Shutdown ──
  # Two-step confirm + 5s auto-timeout (same pattern as PANIC).
  # Step 1 commits the full close: stop OBS rec/stream, recall mixer
  # to scene 0, mute master, pause Spotify, mark service Off.
  - row: 3
    col: 1
    style:
      text: "Shutdown\n終了"
      bgcolor: "#660000"
      color: "#FFFFFF"
      size: 12
    steps:
      - style:
          text: "Shutdown\n終了"
          bgcolor: "#660000"
          color: "#FFFFFF"
          size: 12
        actions:
          down:
            - action: internal:step_delta
              options: { amount: 1 }
            - action: internal:wait
              options: { time: "5000" }
            - action: internal:step_delta
              options: { amount: -1 }
      - style:
          text: "CONFIRM?\n確認？"
          bgcolor: "#FF0000"
          color: "#FFFFFF"
          size: 11
        actions:
          down:
            - action: internal:abort_actions       # cancels timeout + any in-flight
            - action: obs_saitama:stop_recording
            - action: obs_saitama:stop_streaming
            - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
              options: { X: 0, Y: 1 }              # Initial Data — quiet
            - action: yamaha_saitama:MIXER_Current/St/Fader/On
              options: { X: 1, Val: 0 }            # mute master
            - action: spotify_saitama:pause
            - action: internal:custom_variable_set_value
              options: { name: "service_mode", value: "Off" }
            - action: internal:custom_variable_set_value
              options: { name: "close_stage", value: "Stopped" }
            - action: internal:custom_variable_set_value
              options: { name: "active_service_preset", value: "none" }
            - action: internal:custom_variable_set_value
              options: { name: "service_armed", value: "0" }
            - action: internal:step_delta
              options: { amount: -1 }

  # ── SUN AM (Sunday Service preset) ──
  # Selects PP clockIndex 0 (Sunday). Operator sets the actual target
  # time in PP UI. Companion only routes which clock SVC START fires.
  - row: 3
    col: 2
    style:
      text: "SUN AM\n日曜"
      bgcolor: "#553388"
      color: "#FFFFFF"
      size: 12
    actions:
      down:
        - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
          options: { X: 1, Y: 1 }              # scene 1 = Announcements
        - action: obs_saitama:set_current_scene
          options: { scene: "Pre-Service" }
        - action: internal:custom_variable_set_value
          options: { name: "active_service_clock_index", value: "0" }
        - action: internal:custom_variable_set_value
          options: { name: "active_service_preset", value: "Sunday" }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Sunday Prep" }

  # ── THU PM (Thursday Bible Study preset) ──
  # Selects PP clockIndex 1. Operator sets target in PP.
  - row: 3
    col: 3
    style:
      text: "THU PM\n木曜"
      bgcolor: "#335588"
      color: "#FFFFFF"
      size: 12
    actions:
      down:
        - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
          options: { X: 1, Y: 1 }              # same speech-config scene
        - action: obs_saitama:set_current_scene
          options: { scene: "Pre-Service" }
        - action: internal:custom_variable_set_value
          options: { name: "active_service_clock_index", value: "1" }
        - action: internal:custom_variable_set_value
          options: { name: "active_service_preset", value: "Thursday" }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Thursday Prep" }

  # ── SVC START ──
  # Kicks off the active preset's countdown clock. Sets service_armed=1
  # so ARM-gated triggers fire. Single press (no confirm) — operator
  # already chose preset deliberately.
  - row: 3
    col: 4
    style:
      text: "SVC\nSTART"
      bgcolor: "#118800"
      color: "#FFFFFF"
      size: 14
    actions:
      down:
        - action: internal:custom_variable_set_value
          options: { name: "service_armed", value: "1" }
        - action: propresenter_saitama:clockStart
          options:
            clockIndex: "$(internal:custom_active_service_clock_index)"
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Armed" }

  - row: 3
    col: 5
    style:
      text: "→ Segments\n場面"
      bgcolor: "#003366"
      size: 10
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 44 }

  - row: 3
    col: 6
    style:
      text: "→ Audio\n音響"
      bgcolor: "#003366"
      size: 12
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 41 }

  # ── PANIC (existing) ──
  - row: 3
    col: 7
    style:
      text: "PANIC\n緊急"
      bgcolor: "#990000"
      size: 14
    steps:
      - style:
          text: "PANIC\n緊急"
          bgcolor: "#990000"
        actions:
          down:
            - action: internal:step_delta
              options: { amount: 1 }
      - style:
          text: "CONFIRM?\n確認？"
          bgcolor: "#FF0000"
        actions:
          down:
            - action: yamaha_saitama:MIXER_Current/St/Fader/On
              options: { X: 1, Val: 0 }
            - action: internal:step_delta
              options: { amount: -1 }
