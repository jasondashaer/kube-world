# YIBC — Stream Deck MK2 Page 30: Operations
# 5x3 grid — testing ProPresenter + Yamaha TF5 control

page:
  number: 30
  name: "Ops"
  device: mk2  # 5x3 = 15 buttons

buttons:
  # ═══ Row 0: Stream control (unchanged) ═══
  - row: 0
    col: 0
    style:
      text: "STREAM"
      bgcolor: "#555555"
      size: 14
    actions:
      down:
        - action: obs:toggle_streaming
    feedbacks:
      - type: obs:streaming
        style:
          bgcolor: "#CC0000"
          text: "● LIVE"

  - row: 0
    col: 1
    style:
      text: "REC"
      bgcolor: "#555555"
      size: 14
    actions:
      down:
        - action: obs:toggle_recording
    feedbacks:
      - type: obs:recording
        style:
          bgcolor: "#CC0000"
          text: "● REC"

  - row: 0
    col: 2
    style:
      text: "Main"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Main" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Main" }
        style:
          bgcolor: "#00AA00"
          text: "● Main"

  - row: 0
    col: 3
    style:
      text: "Camera"
      bgcolor: "#004499"
      size: 14
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Camera" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Camera" }
        style:
          bgcolor: "#00AA00"
          text: "● Cam"

  - row: 0
    col: 4
    style:
      text: "JST\n$(internal:time_hms)"
      bgcolor: "#222222"
      size: 14

  # ═══ Row 1: ProPresenter test ═══
  - row: 1
    col: 0
    style:
      text: "PREV\nSlide"
      bgcolor: "#553300"
      size: 14
    actions:
      down:
        - action: propresenter_yibc:last

  - row: 1
    col: 1
    style:
      text: "NEXT\nSlide"
      bgcolor: "#553300"
      size: 14
    actions:
      down:
        - action: propresenter_yibc:next

  - row: 1
    col: 2
    style:
      text: "CLEAR\nAll"
      bgcolor: "#993300"
      size: 14
    actions:
      down:
        - action: propresenter_yibc:clearall

  - row: 1
    col: 3
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 1
    col: 4
    style:
      text: ""
      bgcolor: "#1A1A1A"

  # ═══ Row 2: Audio + nav ═══
  - row: 2
    col: 0
    style:
      text: "Master\nMute"
      bgcolor: "#444444"
      size: 12
    actions:
      down:
        - action: yamaha_yibc:MIXER_Current/St/Fader/On
          options: { X: 1, Val: "Toggle" }
        - action: yamaha_yibc:MIXER_Current/Mix/Fader/On
          options: { X: 17, Val: "Toggle" }
    feedbacks:
      - type: yamaha_yibc:MIXER_Current/St/Fader/On
        options: { X: 1, Val: 0 }
        style:
          bgcolor: "#CC0000"
          text: "MUTE"
          size: 14

  - row: 2
