# Flux GitRepository source
# Points to the self-hosted GitLab on the central Pi node
#
# GitLab runs natively on the Pi (systemd, not K8s) at port 8180.
# Flux accesses it via the K8s Service in the gitlab namespace
# (port 80 -> Endpoints 8180), avoiding Traefik NodePort routing.
#
# GitHub remains as a mirror (push to both remotes).
# To revert to GitHub: change url back to https://github.com/jasondashaer/kube-world.git
# and remove secretRef.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kube-world
  namespace: flux-system
spec:
  interval: 30s
  url: http://gitlab.gitlab.svc.cluster.local/root/kube-world.git
  ref:
    branch: main
  # GitLab repo is private — authenticate with token
  secretRef:
    name: gitlab-credentials
