# Ansible Inventory for Raspberry Pi Cluster
#
# BEFORE FIRST USE:
#   1. Connect Pi via ethernet to your router
#   2. Find the Pi's IP (see discovery methods below)
#   3. Update ansible_host= with the actual IP
#
# DISCOVERY METHODS (pick one):
#   - Router admin page: check DHCP leases for "raspberrypi" or "pi-central"
#   - mDNS:   ping raspberrypi.local  (or ssh admin@raspberrypi.local)
#   - nmap:   nmap -sn 192.168.1.0/24 | grep -B2 "Raspberry"
#   - arp:    arp -a | grep "dc:a6:32\|d8:3a:dd\|2c:cf:67\|e4:5f:01"
#             (common Raspberry Pi MAC prefixes)

[all:vars]
ansible_user=admin
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

# K3s configuration
# Note: k3s_version is passed via -e from bootstrap.sh (reads config.yaml)
# This is a fallback only for standalone ansible-playbook runs
k3s_version=v1.34.6+k3s1
k3s_token_file=/var/lib/rancher/k3s/server/node-token

# Cluster settings
cluster_name=pi-cluster
cluster_domain=local

[masters]
# Central management node (Pi 5 16GB) — K3s + Karmada + Rancher + Flux
# [UPDATE] Set ansible_host to your Pi's ethernet IP
pi-central ansible_host=10.5.5.136 node_name=pi-central

[workers]
# Worker nodes that join the central cluster (none currently)

[edge_clusters]
# Independent K3s clusters — each gets its own K3s server, registered with Karmada
pi-edge-1 ansible_host=10.5.5.249 node_name=pi-edge-1

[k3s_cluster:children]
masters
workers
edge_clusters

[edge_devices:children]
k3s_cluster
