# Traefik on pi-edge-1 — managed by Flux helm-controller.
# The HelmRelease lives on the central cluster; kubeConfig tells
# helm-controller to install the chart on the edge cluster.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-edge1
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "39.*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  kubeConfig:
    secretRef:
      name: pi-edge-1-kubeconfig
  targetNamespace: kube-system
  install:
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
      optional: true
  values:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    deployment:
      replicas: 1
    hostNetwork: true
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
      readOnlyRootFilesystem: true
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    ports:
      traefik:
        port: 9000
        expose:
          default: false
      web:
        port: 80
        expose:
          default: true
      websecure:
        port: 443
        expose:
          default: true
    service:
      type: ClusterIP
    logs:
      access:
        enabled: true
        format: json
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false
      kubernetesCRD:
        enabled: true
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
