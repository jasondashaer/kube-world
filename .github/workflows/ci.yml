name: CI

on:
  workflow_dispatch:  # Manual trigger only — CI runs on self-hosted GitLab

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yml .

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: error  # Changed from warning to error for stricter checking

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate app manifests
        run: |
          find apps/ -name '*.yaml' -type f ! -name 'fleet.yaml' | xargs kubeconform -summary -strict -ignore-missing-schemas

      - name: Validate policy manifests
        run: |
          # Kyverno policies use custom CRDs - validate with Kyverno schema
          find policies/ -name '*.yaml' -type f | xargs kubeconform -summary -ignore-missing-schemas \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location default

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Run ansible-lint
        run: |
          # Fail on errors, allow warnings
          ansible-lint pi-setup/ansible/playbook.yml --profile production || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 2 ]; then
              echo "::warning::Ansible lint found warnings (non-blocking)"
              exit 0
            fi
            exit $EXIT_CODE
          }

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'  # Only fail on high/critical

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scanning

      - name: TruffleHog Secrets Scan
        run: |
          docker run --rm -v "$PWD:/workdir" trufflesecurity/trufflehog:latest \
            filesystem /workdir --only-verified --fail

      - name: Check for hardcoded credentials
        run: |
          # Check for common credential patterns
          echo "Scanning for potential hardcoded secrets..."

          # SSH private keys
          if grep -rn "PRIVATE KEY" --include="*.yaml" --include="*.yml" --include="*.sh" . 2>/dev/null | grep -v ".git"; then
            echo "::error::Potential SSH private key found in repository"
            exit 1
          fi

          # AWS keys
          if grep -rn "AKIA[A-Z0-9]{16}" --include="*.yaml" --include="*.yml" --include="*.sh" . 2>/dev/null | grep -v ".git"; then
            echo "::error::Potential AWS access key found in repository"
            exit 1
          fi

          # Generic password patterns (except placeholders)
          if grep -rn "password.*=.*['\"][^${}CHANGE_ME]" --include="*.yaml" --include="*.yml" . 2>/dev/null | grep -v ".git" | grep -v "SOPS" | grep -v "placeholder" | grep -v "example"; then
            echo "::warning::Potential hardcoded password found - verify these are safe"
          fi

          echo "Secrets scan completed"

  test-bootstrap:
    name: Test Bootstrap (Dry Run)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x bootstrap.sh
          chmod +x pi-setup/pi-prep.sh

      - name: Test bootstrap dry run (Mac)
        run: ./bootstrap.sh --dry-run --platform mac --verbose

      - name: Test bootstrap help
        run: ./bootstrap.sh --help

      - name: Test pi-prep help
        run: ./pi-setup/pi-prep.sh --help

  test-bootstrap-linux:
    name: Test Bootstrap (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x bootstrap.sh
          chmod +x pi-setup/pi-prep.sh

      - name: Test bootstrap dry run (Linux/Pi simulation)
        run: ./bootstrap.sh --dry-run --platform pi --verbose

      - name: Validate script syntax
        run: |
          bash -n bootstrap.sh
          bash -n pi-setup/pi-prep.sh
          bash -n rancher/install-rancher.sh
