# Companion HTTPRoute — edge1-specific hostname
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: companion
  namespace: companion
  labels:
    app.kubernetes.io/name: companion
    app.kubernetes.io/part-of: kube-world
spec:
  parentRefs:
    - name: kube-world-gateway
      namespace: kube-system
  hostnames:
    - "companion.edge1.kubew.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: companion
          port: 8000
