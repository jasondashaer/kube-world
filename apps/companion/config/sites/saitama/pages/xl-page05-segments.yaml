# Saitama — Stream Deck XL Page 44: Service Segments
# 8x4 = 32 buttons. Segment-transition pad. Recalls TF1 mixer scenes.
#
# Hybrid design: Companion calls Lib/Bank/Scene/Recall with a scene
# number; the TF1 mixer at Saitama owns the scene contents. Engineers
# tweak EQ/dynamics/routing on the mixer between services without
# touching Companion config.
#
# Set Recall Safe globally on the TF1 to protect master fader + main bus
# from scene recall — otherwise scene change snaps room volume.
#
# Saitama channel mapping (TF1 inputs):
#   Worship=1, Guitar=4, Keys=6, Pastor=11, Media=14
# Scene contents reflect those mappings.

page:
  number: 44
  name: "Segments"
  device: xl

buttons:
  # ═══ Row 0: Primary segments ═══
  - row: 0
    col: 0
    style:
      text: "ANNOUNCE"
      bgcolor: "#003366"
      color: "#FFFFFF"
      size: 12
    actions:
      down:
        # Snapshot current scene BEFORE recall — PANIC can revert.
        - action: internal:custom_variable_set_expression
          options:
            name: "previous_segment_scene"
            expression: "$(Yamaha_TF1__Saitama_:curScene)"
        - action: internal:custom_variable_set_value
          options: { name: "abort_active", value: "0" }
        - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
          options: { X: 1, Y: 1 }
        - action: internal:custom_variable_set_value
