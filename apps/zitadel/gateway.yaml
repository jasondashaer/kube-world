# Zitadel HTTPRoutes via Gateway API
#
# Zitadel v4.x has two services:
#   - zitadel:8080       — API (OIDC, management, admin console, gRPC)
#   - zitadel-login:3000 — Login v2 UI (Next.js, serves at /ui/v2/login/)
#
# The OIDC authorize endpoint on the API server redirects to
# /ui/v2/login/login?authRequest=... which must be served by the
# login service. All other paths go to the main API.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel-login
  namespace: zitadel
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/part-of: kube-world
spec:
  parentRefs:
    - name: kube-world-gateway
      namespace: kube-system
  hostnames:
    - "auth.kubew.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui/v2/login
      backendRefs:
        - name: zitadel-login
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel-api
  namespace: zitadel
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/part-of: kube-world
spec:
  parentRefs:
    - name: kube-world-gateway
      namespace: kube-system
  hostnames:
    - "auth.kubew.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zitadel
          port: 8080
