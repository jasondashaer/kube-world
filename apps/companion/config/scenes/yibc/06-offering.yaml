# YIBC TF5 — Scene 6: Offering
#
# Worship music open as offertory cue. Pastor mic available for prayer
# over the offering. Music is the foreground; pastor steps in briefly.

scene:
  number: 6
  bank: B
  name: "Offering"
  description: "Worship music open, pastor mic available for prayer."

state:
  inputs:
    # Music open — offertory is the foreground element
    - channel: 1
      label: "Worship"
      mute: false
      fader: -100   # -1dB, full mix for offering

    - channel: 4
      label: "Guitar"
      mute: false
      fader: -100

    - channel: 6
      label: "Keys"
      mute: false
      fader: -100

    # Pastor mic open at speech level — pastor often prays over the offering
    - channel: 11
      label: "Pastor"
      mute: false
      fader: -300   # -3dB — speech level, sits on top of music
      hpf:
        enable: true
        freq: 100

    - channel: 14
      label: "Media"
      mute: true
      fader: -32768

  buses:
    - channel: 21
      label: "Stream Mix"
      mute: false
      fader: -100   # -1dB matching room for music-forward feel

  master:
    fader: -100     # -1dB
    mute: false
