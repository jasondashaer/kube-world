# Karmada PropagationPolicy for Bitfocus Companion
# Schedules Companion on edge/IoT clusters alongside Home Assistant
---
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: companion
  namespace: companion
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      name: companion
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: companion-data
    - apiVersion: v1
      kind: Service
      name: companion
    # GitOps auto-import pipeline (Deployment with init container, not Job —
    # Job PodTemplateSpec is immutable so kustomize ConfigMap re-hash would
    # break Apply; Deployment allows rolling updates).
    - apiVersion: apps/v1
      kind: Deployment
      name: companion-deploy
    # ConfigMaps generated by kustomize from YAML config files.
    # Names include hash suffix (e.g. companion-config-abc123); use
    # labelSelector to match all generated maps regardless of suffix.
    - apiVersion: v1
      kind: ConfigMap
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: kube-world

  placement:
    clusterAffinity:
      labelSelector:
        matchExpressions:
          - key: workload-type
            operator: In
            values:
              - iot
    spreadConstraints:
      - spreadByField: cluster
        maxGroups: 1
        minGroups: 1
