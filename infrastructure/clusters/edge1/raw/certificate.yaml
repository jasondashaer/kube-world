# Wildcard TLS certificate for *.edge1.kubew.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-wildcard
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: kube-world
spec:
  secretName: kube-world-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # The second SAN creates a new LE rate limit bucket (different identifier
  # set) and uses a different TXT record name than the wildcard, avoiding
  # the cert-manager concurrent challenge race condition.
  # Must be a two-level subdomain — one-level is covered by the wildcard
  # and LE rejects it as redundant.
  # Can be removed once the old *.edge1.kubew.dev bucket fully clears (~Apr 17)
  dnsNames:
    - "*.edge1.kubew.dev"
    - "cert.internal.edge1.kubew.dev"
