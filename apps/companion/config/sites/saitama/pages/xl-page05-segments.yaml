  # PANIC / FREEZE — abort any in-flight transition + revert to the
  # previous segment scene. Two-step confirm to prevent accidents.
  #
  # Step 0 (dim red, "PANIC"): Press → advances to step 1; no destructive
  #   action yet.
  # Step 1 (bright red, "ABORT?"): Press to commit:
  #   1. internal:abort_actions — stops queued actions (active fades,
  #      waits, queued RCP sends).
  #   2. abort_active=1 — flag for future smooth-fade macros to poll
  #      between steps and bail early.
  #   3. Recall previous_segment_scene (snapshotted by every segment
  #      button BEFORE its recall). Mixer reverts to the prior segment.
  #   4. service_mode → "Aborted" so other-page status pads reflect.
  #   5. Returns to step 0 (resting).
  # Press once and don't confirm = nothing destructive happens.
  - row: 3
    col: 4
    style:
      text: "PANIC\n緊急"
      bgcolor: "#990000"
      color: "#FFFFFF"
      size: 12
    steps:
      - style:
          text: "PANIC\n緊急"
          bgcolor: "#990000"
          color: "#FFFFFF"
          size: 12
        actions:
          down:
            - action: internal:step_delta
              options: { amount: 1 }
            # Auto-timeout: queue a 5s wait then step back to step 0.
            # If user confirms within 5s, step 1's down begins with
            # internal:abort_actions which cancels this queued wait +
            # step_delta — chain stops, confirm proceeds. If 5s elapses
            # with no confirm, queued step_delta -1 fires → button
            # returns to PANIC resting state.
            - action: internal:wait
              options: { time: "5000" }
            - action: internal:step_delta
              options: { amount: -1 }
      - style:
          text: "ABORT?\n中止確認"
          bgcolor: "#FF0000"
          color: "#FFFFFF"
          size: 11
        actions:
          down:
            # First action ALSO cancels the pending timeout chain queued
            # by step 0 — operator's confirm wins over the auto-revert.
            - action: internal:abort_actions
            - action: internal:custom_variable_set_value
              options: { name: "abort_active", value: "1" }
            - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
              options:
                X: "$(internal:custom_previous_segment_scene)"
                Y: 1
            - action: internal:custom_variable_set_value
              options: { name: "service_mode", value: "Aborted" }
            - action: internal:step_delta
              options: { amount: -1 }

