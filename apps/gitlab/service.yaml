# GitLab CE Service Endpoint for Kubernetes
#
# GitLab runs natively on the central Pi host (systemd) because the official
# gitlab/gitlab-ce Docker image is amd64-only. This Service + Endpoints
# pair makes the native GitLab reachable from within the K8s cluster.
#
# When the central node upgrades to amd64 server hardware, replace this
# with the full K8s deployment (see deployment.yaml.amd64-future).
#
# GitLab listens on the host at:
#   - HTTP: port 8180 (bound by gitlab nginx, configured in install-gitlab.sh)
#   - SSH:  port 22
#
# Traffic flow: Traefik (port 80/443) → HTTPRoute → Service:80 → Endpoints:8180 → GitLab
#
# The __PI_IP__ placeholder is substituted by bootstrap.sh (install_gitlab_native)
# with the central Pi's node internal IP before kubectl apply.
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/part-of: kube-world
subsets:
  - addresses:
      # Host IP of the central Pi node — substituted at apply time
      - ip: "__PI_IP__"
    ports:
      - name: http
        port: 8180
        protocol: TCP
      - name: ssh
        port: 22
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/part-of: kube-world
spec:
  # No selector — manually managed Endpoints above
  type: ClusterIP
  # Pinned so the address is stable across wipe-and-rebuild. The Renovate
  # CronJob hostAliases gitlab.kubew.dev to this IP (GitLab's external_url
  # clone host doesn't resolve in-cluster), so it must not float.
  clusterIP: 10.43.61.251
  ports:
    - name: http
      port: 80
      targetPort: 8180
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
