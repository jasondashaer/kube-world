# Saitama — Stream Deck XL Page 40: Home Dashboard
# 8x4 = 32 buttons

page:
  number: 40
  name: "Home"
  device: xl

buttons:
  # ═══ Row 0: Status bar ═══
  - row: 0
    col: 0
    style:
      text: "ATEM"
      bgcolor: "#991111"
      size: 14
    feedbacks:
      - type: atem:connected
        style:
          bgcolor: "#116611"
          text: "ATEM\n● OK"

  - row: 0
    col: 1
    style:
      text: "OBS"
      bgcolor: "#991111"
      size: 14
    feedbacks:
      - type: obs:connected
        style:
          bgcolor: "#116611"
          text: "OBS\n● OK"

  - row: 0
    col: 2
    style:
      text: "Audio\n音響"
      bgcolor: "#991111"
      size: 12
    feedbacks:
      - type: yamaha_saitama:connected
        style:
          bgcolor: "#116611"
          text: "Audio\n● OK"

  - row: 0
    col: 3
    style:
      text: "ProP"
      bgcolor: "#991111"
      size: 14
    feedbacks:
      - type: propresenter_saitama:connected
        style:
          bgcolor: "#116611"
          text: "ProP\n● OK"

  - row: 0
    col: 4
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 0
    col: 5
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 0
    col: 6
    style:
      text: "$(internal:custom_service_mode)"
      bgcolor: "#444444"
      size: 14

  - row: 0
    col: 7
    style:
      text: "$(internal:time_hms)"
      bgcolor: "#222222"
      size: 16

  # ═══ Row 1: Slides + Stream/Rec + Intro/Outro ═══
  - row: 1
    col: 0
    style:
      text: "PREV\n前へ"
      bgcolor: "#553300"
      size: 14
    actions:
      down:
        - action: propresenter_saitama:last

  - row: 1
    col: 1
    style:
      text: "NEXT\n次へ"
      bgcolor: "#553300"
      size: 14
    actions:
      down:
        - action: propresenter_saitama:next

  - row: 1
    col: 2
    style:
      text: "GO\n進む"
      bgcolor: "#00AA00"
      size: 18
    actions:
      down:
        - action: propresenter_saitama:next

  - row: 1
    col: 3
    style:
      text: "CLEAR\nクリア"
      bgcolor: "#664400"
      size: 12
    actions:
      down:
        - action: propresenter_saitama:clearslide

  - row: 1
    col: 4
    style:
      text: "STREAM\n配信"
      bgcolor: "#555555"
      size: 12
    actions:
      down:
        - action: obs:toggle_streaming
    feedbacks:
      - type: obs:streaming
        style:
          bgcolor: "#CC0000"
          text: "● LIVE\n配信中"

  - row: 1
    col: 5
    style:
      text: "REC\n録画"
      bgcolor: "#555555"
      size: 14
    actions:
      down:
        - action: obs:toggle_recording
    feedbacks:
      - type: obs:recording
        style:
          bgcolor: "#CC0000"
          text: "● REC\n録画中"

  - row: 1
    col: 6
    style:
      text: "Intro\nイントロ"
      bgcolor: "#004499"
      size: 12
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Intro" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Intro" }
        style:
          bgcolor: "#00AA00"
          text: "● Intro"

  - row: 1
    col: 7
    style:
      text: "Outro\nアウトロ"
      bgcolor: "#004499"
      size: 12
    actions:
      down:
        - action: obs:set_current_scene
          options: { scene: "Outro" }
    feedbacks:
      - type: obs:scene_active
        options: { scene: "Outro" }
        style:
          bgcolor: "#00AA00"
          text: "● Outro"

  # ═══ Row 2: Timers + Scenes + Mute/Duck ═══
  - row: 2
    col: 0
    style:
      text: "Timer\n開始"
      bgcolor: "#006600"
      size: 12
    actions:
      down:
        - action: propresenter_saitama:clockStart
          options: { clockIndex: "0" }

  - row: 2
    col: 1
    style:
      text: "Timer\n停止"
      bgcolor: "#660000"
      size: 12
    actions:
      down:
        - action: propresenter_saitama:clockStop
          options: { clockIndex: "0" }

  - row: 2
    col: 2
    style:
      text: "Timer\nリセット"
      bgcolor: "#444444"
      size: 10
    actions:
      down:
        - action: propresenter_saitama:clockReset
          options: { clockIndex: "0" }

  # Worship → TF1 Bank A scene 2 (matches scenes/saitama/02-worship.yaml).
  # Bank A is engineer-owned working scenes; engineers can edit content
  # between services without touching this YAML. See scene-strategy.md.
  - row: 2
    col: 3
    style:
      text: "Worship\n賛美"
      bgcolor: "#664400"
      size: 10
    actions:
      down:
        - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
          options: { X: 2, Y: 1 }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Worship" }

  # Speaking (= Sermon) → TF1 Bank A scene 3
  # (matches scenes/saitama/03-sermon.yaml).
  - row: 2
    col: 4
    style:
      text: "Speaking\n説教"
      bgcolor: "#664400"
      size: 10
    actions:
      down:
        - action: yamaha_saitama:MIXER_Lib/Bank/Scene/Recall
          options: { X: 3, Y: 1 }
        - action: internal:custom_variable_set_value
          options: { name: "service_mode", value: "Sermon" }

  - row: 2
    col: 5
    style:
      text: "Pastor\nミュート"
      bgcolor: "#444444"
      size: 10
    actions:
      down:
        - action: yamaha_saitama:MIXER_Current/InCh/Fader/On
          options: { X: 11, Val: "Toggle" }
    feedbacks:
      - type: yamaha_saitama:MIXER_Current/InCh/Fader/On
        options: { X: 11, Val: 0 }
        style:
          bgcolor: "#CC0000"
          text: "MUTE\nミュート"
          size: 10

  - row: 2
    col: 6
    style:
      text: "Master\nミュート"
      bgcolor: "#444444"
      size: 10
    actions:
      down:
        - action: yamaha_saitama:MIXER_Current/St/Fader/On
          options: { X: 1, Val: "Toggle" }
    feedbacks:
      - type: yamaha_saitama:MIXER_Current/St/Fader/On
        options: { X: 1, Val: 0 }
        style:
          bgcolor: "#CC0000"
          text: "MUTE\nミュート"
          size: 10

  - row: 2
    col: 7
    style:
      text: "DUCK\nダック"
      bgcolor: "#664400"
      size: 12
    steps:
      - style:
          text: "DUCK\nダック"
          bgcolor: "#664400"
        actions:
          down:
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -500 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -1000 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -1500 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -2000 }
            - action: internal:step_delta
              options: { amount: 1 }
      - style:
          text: "UNDUCK\n戻す"
          bgcolor: "#CC6600"
        actions:
          down:
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -1500 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -1000 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: -500 }
            - action: internal:wait
              options: { time: "100" }
            - action: yamaha_saitama:MIXER_Current/St/Fader/Level
              options: { X: 1, Val: 0 }
            - action: internal:step_delta
              options: { amount: -1 }

  # ═══ Row 3: Utilities + navigation + safety ═══
  - row: 3
    col: 0
    style:
      text: "Startup\n起動"
      bgcolor: "#006600"
      size: 12
    actions:
      down:
        - action: internal:custom_variable_set_value
          options: { name: "startup_phase", value: "Starting" }

  - row: 3
    col: 1
    style:
      text: "Shutdown\n終了"
      bgcolor: "#660000"
      size: 12
    steps:
      - style:
          text: "Shutdown\n終了"
          bgcolor: "#660000"
        actions:
          down:
            - action: internal:step_delta
              options: { amount: 1 }
      - style:
          text: "CONFIRM?\n確認？"
          bgcolor: "#FF0000"
        actions:
          down:
            - action: internal:step_delta
              options: { amount: -1 }

  - row: 3
    col: 2
    style:
      text: ""
      bgcolor: "#1A1A1A"

  - row: 3
    col: 3
    style:
      text: "→ Segments\n場面"
      bgcolor: "#003366"
      size: 10
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 44 }

  - row: 3
    col: 4
    style:
      text: "→ Audio\n音響"
      bgcolor: "#003366"
      size: 12
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 41 }

  - row: 3
    col: 5
    style:
      text: "→ ProP\nスライド"
      bgcolor: "#003366"
      size: 10
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 42 }

  - row: 3
    col: 6
    style:
      text: "→ Stream\n配信"
      bgcolor: "#003366"
      size: 10
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 43 }

  - row: 3
    col: 7
    style:
      text: "PANIC\n緊急"
      bgcolor: "#990000"
      size: 14
    steps:
      - style:
          text: "PANIC\n緊急"
          bgcolor: "#990000"
        actions:
          down:
            - action: internal:step_delta
              options: { amount: 1 }
      - style:
          text: "CONFIRM?\n確認？"
          bgcolor: "#FF0000"
        actions:
          down:
            - action: yamaha_saitama:MIXER_Current/St/Fader/On
              options: { X: 1, Val: 0 }
            - action: internal:step_delta
              options: { amount: -1 }
