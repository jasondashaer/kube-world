# Karmada PropagationPolicy for IoT companion apps
# All deploy to the same edge/IoT clusters as Home Assistant
---
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: nodered
  namespace: home-assistant
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      name: nodered
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: nodered-data
    - apiVersion: v1
      kind: Service
      name: nodered
  placement:
    clusterAffinity:
      labelSelector:
        matchExpressions:
          - key: workload-type
            operator: In
            values:
              - iot
    spreadConstraints:
      - spreadByField: cluster
        maxGroups: 1
        minGroups: 1

