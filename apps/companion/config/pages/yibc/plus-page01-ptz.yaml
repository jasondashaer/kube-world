# YIBC — Stream Deck+ Page 1: PTZ Camera Control
# Buttons: camera presets + speed selection
# Encoders: pan/tilt/zoom/focus with press actions

page:
  number: 1
  name: "PTZ Control"
  device: plus  # 4x2 buttons + 4 encoders

buttons:
  # Row 0: Camera presets (tap = recall, hold = save)
  - row: 0
    col: 0
    style:
      text: "Wide\nワイド"
      bgcolor: "#0066CC"
      size: 14
    actions:
      down:
        - action: ptz:preset_recall
          options: { preset: 0 }
      long_press:
        - action: ptz:preset_save
          options: { preset: 0 }
    feedbacks:
      - type: ptz:preset_active
        options: { preset: 0 }
        style:
          bgcolor: "#00CC00"
          text: "● Wide"

  - row: 0
    col: 1
    style:
      text: "Pulpit\n説教台"
      bgcolor: "#0066CC"
      size: 14
    actions:
      down:
        - action: ptz:preset_recall
          options: { preset: 1 }
      long_press:
        - action: ptz:preset_save
          options: { preset: 1 }
    feedbacks:
      - type: ptz:preset_active
        options: { preset: 1 }
        style:
          bgcolor: "#00CC00"

  - row: 0
    col: 2
    style:
      text: "Worship\n賛美"
      bgcolor: "#0066CC"
      size: 14
    actions:
      down:
        - action: ptz:preset_recall
          options: { preset: 2 }
      long_press:
        - action: ptz:preset_save
          options: { preset: 2 }
    feedbacks:
      - type: ptz:preset_active
        options: { preset: 2 }
        style:
          bgcolor: "#00CC00"

  - row: 0
    col: 3
    style:
      text: "Custom\nカスタム"
      bgcolor: "#0066CC"
      size: 14
    actions:
      down:
        - action: ptz:preset_recall
          options: { preset: 3 }
      long_press:
        - action: ptz:preset_save
          options: { preset: 3 }
    feedbacks:
      - type: ptz:preset_active
        options: { preset: 3 }
        style:
          bgcolor: "#00CC00"

  # Row 1: Speed selection + navigation
  - row: 1
    col: 0
    style:
      text: "Slow\nゆっくり"
      bgcolor: "#333333"
      size: 12
    actions:
      down:
        - action: internal:variable_set
          options: { variable: "ptz_pan_speed", value: "3" }
        - action: internal:variable_set
          options: { variable: "ptz_tilt_speed", value: "3" }
        - action: internal:variable_set
          options: { variable: "ptz_zoom_speed", value: "1" }
    feedbacks:
      - type: internal:variable_value
        options: { variable: "ptz_pan_speed", value: "3" }
        style:
          bgcolor: "#00CC00"

  - row: 1
    col: 1
    style:
      text: "Med\n中速"
      bgcolor: "#333333"
      size: 12
    actions:
      down:
        - action: internal:variable_set
          options: { variable: "ptz_pan_speed", value: "8" }
        - action: internal:variable_set
          options: { variable: "ptz_tilt_speed", value: "6" }
        - action: internal:variable_set
          options: { variable: "ptz_zoom_speed", value: "3" }
    feedbacks:
      - type: internal:variable_value
        options: { variable: "ptz_pan_speed", value: "8" }
        style:
          bgcolor: "#00CC00"

  - row: 1
    col: 2
    style:
      text: "Fast\n高速"
      bgcolor: "#333333"
      size: 12
    actions:
      down:
        - action: internal:variable_set
          options: { variable: "ptz_pan_speed", value: "16" }
        - action: internal:variable_set
          options: { variable: "ptz_tilt_speed", value: "14" }
        - action: internal:variable_set
          options: { variable: "ptz_zoom_speed", value: "5" }
    feedbacks:
      - type: internal:variable_value
        options: { variable: "ptz_pan_speed", value: "16" }
        style:
          bgcolor: "#00CC00"

  - row: 1
    col: 3
    style:
      text: "AF/MF"
      bgcolor: "#333333"
      size: 14
    actions:
      down:
        - action: ptz:focus_auto_toggle
    feedbacks:
      - type: ptz:focus_mode
        options: { mode: "auto" }
        style:
          bgcolor: "#00CC00"
          text: "AUTO\nオート"
      - type: ptz:focus_mode
        options: { mode: "manual" }
        style:
          bgcolor: "#CCCC00"
          text: "MANUAL\n手動"

encoders:
  # E0: Pan
  - encoder: 0
    style:
      text: "PAN"
      size: 14
    actions:
      rotate_cw:
        - action: ptz:pan_right
          options: { speed: "$(internal:ptz_pan_speed)" }
      rotate_ccw:
        - action: ptz:pan_left
          options: { speed: "$(internal:ptz_pan_speed)" }
      down:
        - action: ptz:pan_tilt_home
      long_press:
        - action: ptz:pan_tilt_stop

  # E1: Tilt
  - encoder: 1
    style:
      text: "TILT"
      size: 14
    actions:
      rotate_cw:
        - action: ptz:tilt_up
          options: { speed: "$(internal:ptz_tilt_speed)" }
      rotate_ccw:
        - action: ptz:tilt_down
          options: { speed: "$(internal:ptz_tilt_speed)" }
      down:
        - action: ptz:pan_tilt_home
      long_press:
        - action: ptz:pan_tilt_stop

  # E2: Zoom
  - encoder: 2
    style:
      text: "ZOOM\n$(ptz:zoom_pct)%"
      size: 12
    actions:
      rotate_cw:
        - action: ptz:zoom_in
          options: { speed: "$(internal:ptz_zoom_speed)" }
      rotate_ccw:
        - action: ptz:zoom_out
          options: { speed: "$(internal:ptz_zoom_speed)" }
      down:
        - action: ptz:preset_recall
          options: { preset: 0 }  # Quick wide shot
      long_press:
        - action: ptz:zoom_stop

  # E3: Focus
  - encoder: 3
    style:
      text: "FOCUS"
      size: 14
    actions:
      rotate_cw:
        - action: ptz:focus_far
          options: { speed: 2 }
      rotate_ccw:
        - action: ptz:focus_near
          options: { speed: 2 }
      down:
        - action: ptz:focus_one_push
      long_press:
        - action: ptz:focus_auto_toggle
    feedbacks:
      - type: ptz:focus_mode
        options: { mode: "auto" }
        style:
          bgcolor: "#00CC00"
          text: "AF"
