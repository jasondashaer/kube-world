# YIBC — Stream Deck MK2 Page 34: PP Messages Layout C
# 5x3 grid. Layout C = phone-keypad 3x3 (1-9 in cols 0-2) with 0
# alone in row 2 col 3, controls in col 3-4.
#
# Layout:
#   Row 0: [1] [2] [3] [Display] [SHOW]
#   Row 1: [4] [5] [6] [HIDE]    [CLR]
#   Row 2: [7] [8] [9] [0]       [Layout C → A]

page:
  number: 34
  name: "PP Messages C"
  device: mk2

buttons:
  # ═══ Row 0: Digits 1-3 + Display + SHOW ═══
  - row: 0
    col: 0
    style:
      text: "1"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '1')"

  - row: 0
    col: 1
    style:
      text: "2"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '2')"

  - row: 0
    col: 2
    style:
      text: "3"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '3')"

  - row: 0
    col: 3
    style:
      text: "Msg:\n$(internal:custom_pp_message_input)"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 14

  - row: 0
    col: 4
    style:
      text: "SHOW"
      bgcolor: "#118800"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: propresenter_yibc:messageSend
          options:
            messageIndex: "0"
            messageKeys: "name"
            messageValues: "$(internal:custom_pp_message_input)"

  # ═══ Row 1: Digits 4-6 + HIDE + CLR ═══
  - row: 1
    col: 0
    style:
      text: "4"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '4')"

  - row: 1
    col: 1
    style:
      text: "5"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '5')"

  - row: 1
    col: 2
    style:
      text: "6"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '6')"

  - row: 1
    col: 3
    style:
      text: "HIDE"
      bgcolor: "#990000"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: propresenter_yibc:messageHide
          options:
            messageIndex: "0"

  - row: 1
    col: 4
    style:
      text: "CLR"
      bgcolor: "#664400"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: internal:custom_variable_set_value
          options:
            name: "pp_message_input"
            value: ""

  # ═══ Row 2: Digits 7-9 + 0 + Layout cycle ═══
  - row: 2
    col: 0
    style:
      text: "7"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '7')"

  - row: 2
    col: 1
    style:
      text: "8"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '8')"

  - row: 2
    col: 2
    style:
      text: "9"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '9')"

  - row: 2
    col: 3
    style:
      text: "0"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '0')"

  - row: 2
    col: 4
    style:
      text: "Layout C\n→ A"
      bgcolor: "#444444"
      color: "#FFFFFF"
      size: 11
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 32 }
