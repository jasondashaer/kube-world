# YIBC — Stream Deck MK2 Page 33: PP Messages Layout B
# 5x3 grid. Layout B = digits 1-5 row 0, 6-0 row 1, controls row 2.
# All controls grouped on bottom row for clear separation between
# digit-input and action zones.
#
# Layout:
#   Row 0: [1] [2] [3] [4] [5]
#   Row 1: [6] [7] [8] [9] [0]
#   Row 2: [Display:12]  [SHOW]  [HIDE]  [CLR]  [Layout B → C]

page:
  number: 33
  name: "PP Messages B"
  device: mk2

buttons:
  # ═══ Row 0: Digits 1-5 ═══
  - row: 0
    col: 0
    style:
      text: "1"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '1')"

  - row: 0
    col: 1
    style:
      text: "2"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '2')"

  - row: 0
    col: 2
    style:
      text: "3"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '3')"

  - row: 0
    col: 3
    style:
      text: "4"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '4')"

  - row: 0
    col: 4
    style:
      text: "5"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '5')"

  # ═══ Row 1: Digits 6-0 ═══
  - row: 1
    col: 0
    style:
      text: "6"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '6')"

  - row: 1
    col: 1
    style:
      text: "7"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '7')"

  - row: 1
    col: 2
    style:
      text: "8"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '8')"

  - row: 1
    col: 3
    style:
      text: "9"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '9')"

  - row: 1
    col: 4
    style:
      text: "0"
      bgcolor: "#222244"
      color: "#FFFFFF"
      size: 24
    actions:
      down:
        - action: internal:custom_variable_set_expression
          options:
            name: "pp_message_input"
            expression: "concat($(internal:custom_pp_message_input), '0')"

  # ═══ Row 2: Controls ═══
  - row: 2
    col: 0
    style:
      text: "Msg:\n$(internal:custom_pp_message_input)"
      bgcolor: "#222222"
      color: "#FFFFFF"
      size: 14

  - row: 2
    col: 1
    style:
      text: "SHOW"
      bgcolor: "#118800"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: propresenter_yibc:messageSend
          options:
            messageIndex: "0"
            messageKeys: "name"
            messageValues: "$(internal:custom_pp_message_input)"

  - row: 2
    col: 2
    style:
      text: "HIDE"
      bgcolor: "#990000"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: propresenter_yibc:messageHide
          options:
            messageIndex: "0"

  - row: 2
    col: 3
    style:
      text: "CLR"
      bgcolor: "#664400"
      color: "#FFFFFF"
      size: 18
    actions:
      down:
        - action: internal:custom_variable_set_value
          options:
            name: "pp_message_input"
            value: ""

  - row: 2
    col: 4
    style:
      text: "Layout B\n→ C"
      bgcolor: "#444444"
      color: "#FFFFFF"
      size: 11
    actions:
      down:
        - action: internal:set_page
          options: { controller: "self", page: 34 }
