# Home Assistant configuration managed via GitOps.
# Mounted as /config/configuration.yaml via subPath (PVC holds .storage/ state).
# Changes here → git push → Flux syncs → Karmada propagates → pod restarts.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
data:
  configuration.yaml: |
    # Home identity and location — pre-configured to skip onboarding wizard.
    # Change these values and push to GitLab to update.
    homeassistant:
      name: "Home"
      latitude: 35.2271
      longitude: -80.8431
      elevation: 229
      unit_system: us_customary
      time_zone: "America/New_York"
      currency: "USD"
      country: "US"
      language: "en"
      external_url: "https://ha.edge1.kubew.dev"

    # Loads default set of integrations. Do not remove.
    default_config:

    # HTTP — reverse proxy support for Traefik
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16      # K3s pod CIDR
        - 10.43.0.0/16      # K3s service CIDR
        - 10.0.0.0/8        # LAN (covers any home network)
        - 100.64.0.0/10     # Tailscale CGNAT range
        - 127.0.0.1

    # Frontend themes
    frontend:
      themes: !include_dir_merge_named themes

    # SSO via native OIDC (hass-oidc-auth custom component)
    # Requires custom_components/auth_oidc/ installed on the PVC.
    auth_oidc:
      client_id: "HA_OIDC_CLIENT_ID"
      client_secret: "HA_OIDC_CLIENT_SECRET"
      discovery_url: "https://auth.DOMAIN/.well-known/openid-configuration"
      display_name: "Zitadel SSO"
      groups_scope: "urn:zitadel:iam:org:project:id:zitadel:aud"
      features:
        include_groups_scope: true
      # Zitadel's native role claim (urn:zitadel:iam:org:project:roles) is a nested
      # object, which hass-oidc-auth rejects ("Groups claim is not a list").
      # The seed's flattenRoles action emits a flat array into the "groups" claim
      # (id_token + userinfo) — read that instead.
      claims:
        groups: "groups"
      roles:
        admin: "admin"
        user: "user"
      network:
        tls_verify: true

    # Include files for automations, scripts, scenes
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # Tesla charge-port release — manual kill switch (ON = release allowed).
    # The actual safety lives in the script gates; this is a hard override.
    input_boolean:
      tesla_unlatch_enabled:
        name: "Tesla charge-port release enabled"
        icon: mdi:ev-plug-tesla
        initial: true

    # Packages — organized config by area/function
    # homeassistant:
    #   packages: !include_dir_named packages/

  automations.yaml: "[]"
  scripts.yaml: |
    # Tesla charge-port unlatch — releases the cable latch so the car can be
    # unplugged. Charge-port ONLY; no drive/door/cabin actions.
    #
    # IMPORTANT: the Tessie integration names entities after the car's display
    # name. Replace every `tesla` entity prefix below with the real one after
    # you add the integration (e.g. sensor.<carname>_battery_level).
    #
    # All gates are fail-closed: unknown/unavailable state aborts (never opens).
    tesla_charge_port_unlatch:
      alias: "Tesla — Release Charge Port"
      icon: mdi:ev-plug-tesla
      mode: single
      sequence:
        - choose:
            # Gate 1 — feature hard-disabled by the kill switch
            - conditions:
                - condition: state
                  entity_id: input_boolean.tesla_unlatch_enabled
                  state: "off"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Port"
                    message: "release blocked — kill switch off"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Port"
                    message: "Charge-port release is turned off."
            # Gate 2 — must be at home (fail-closed: away/unknown aborts)
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: device_tracker.tesla_location
                      state: "home"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Port"
                    message: "release blocked — not home"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Port"
                    message: "Tesla isn't home."
            # Gate 3 — must be parked (fail-closed: not 'P' aborts)
            - conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: sensor.tesla_shift_state
                      state: "P"
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Port"
                    message: "release blocked — not parked"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Port"
                    message: "Tesla isn't parked."
            # Gate 4 — battery >= 50% (fail-closed: below 50 OR unknown aborts)
            - conditions:
                - condition: not
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.tesla_battery_level
                      above: 49
              sequence:
                - service: logbook.log
                  data:
                    name: "Tesla Charge Port"
                    message: "release blocked — battery below 50% or unknown"
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Port"
                    message: "Tesla battery too low — leave it plugged in."
            # Gate 5 — already unlocked (idempotent no-op)
            - conditions:
                - condition: state
                  entity_id: cover.tesla_charge_port
                  state: "open"
              sequence:
                - service: persistent_notification.create
                  data:
                    notification_id: tesla_unlatch
                    title: "Tesla Charge Port"
                    message: "Charge port already unlocked."
          # All gates passed — release the latch
          default:
            - service: cover.open_cover
              target:
                entity_id: cover.tesla_charge_port
            - service: logbook.log
              data:
                name: "Tesla Charge Port"
                message: "released via HA dashboard (all gates passed)"
                entity_id: cover.tesla_charge_port
            - service: persistent_notification.create
              data:
                notification_id: tesla_unlatch
                title: "Tesla Charge Port"
                message: "Charge port unlocked — you can unplug now."
  scenes.yaml: "[]"
