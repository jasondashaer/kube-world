# Let's Encrypt ClusterIssuer for edge1 — same Cloudflare solver as central
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: kube-world
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jackson@kubew.dev
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - kubew.dev
