# PostgreSQL for Zitadel — Bitnami Helm chart via Flux HelmRelease.
#
# Separate from GitLab's bundled PostgreSQL (which runs natively).
# This is a lightweight single-instance PostgreSQL tuned for Pi 5
# with minimal resource usage (~128-256MB RAM).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel-postgresql
  namespace: zitadel
spec:
  interval: 30m
  chart:
    spec:
      chart: postgresql
      version: "16.*"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    # Single instance (no replication) for homelab
    architecture: standalone

    # Auth — Zitadel connects with these credentials
    auth:
      postgresPassword: "zitadel-pg-admin"
      username: "zitadel"
      password: "zitadel-pg-password"
      database: "zitadel"

    # Pi-optimized resource limits
    primary:
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

      # PostgreSQL tuning for Pi (shared with K3s, Karmada, Rancher, GitLab)
      extendedConfiguration: |
        shared_buffers = 64MB
        work_mem = 4MB
        maintenance_work_mem = 32MB
        effective_cache_size = 128MB
        max_connections = 50
        max_worker_processes = 2

      persistence:
        enabled: true
        size: 2Gi
        storageClass: "local-path"

    # Disable metrics exporter (we'll add Prometheus later)
    metrics:
      enabled: false
