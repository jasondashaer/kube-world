# GitLab CI/CD Pipeline for kube-world
#
# Runs on the self-hosted Pi runner (shell executor).
# Sends pass/fail notifications to ntfy on every pipeline.
#
# Stages: lint → validate → security → test → notify

stages:
  - lint
  - validate
  - security
  - test
  - dev
  - prod
  - notify

variables:
  NTFY_URL: "http://localhost:8090/kube-world"

# ─────────────────────────────────────────────────────────────
# Lint Stage
# ─────────────────────────────────────────────────────────────
yamllint:
  stage: lint
  tags: [shell]
  script:
    - yamllint -c .yamllint.yml .

shellcheck:
  stage: lint
  tags: [shell]
  script:
    - |
      find . -name '*.sh' -type f -not -path './.git/*' | while read -r f; do
        echo "Checking: $f"
        shellcheck --severity=error "$f"
      done

# ─────────────────────────────────────────────────────────────
# Validate Stage
# ─────────────────────────────────────────────────────────────
validate-k8s:
  stage: validate
  tags: [shell]
  script:
    - >-
      find apps/ -name '*.yaml' -type f
      ! -name 'fleet.yaml' ! -name '*.amd64-future'
      | xargs kubeconform -summary -strict
      -ignore-missing-schemas
    - >-
      find policies/ -name '*.yaml' -type f
      | xargs kubeconform -summary -ignore-missing-schemas
      -schema-location default

ansible-lint:
  stage: validate
  tags: [shell]
  script:
    - |
      ansible-lint pi-setup/ansible/playbook.yml --profile production || {
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 2 ]; then
          echo "Ansible lint found warnings (non-blocking)"
          exit 0
        fi
        exit $EXIT_CODE
      }

# ─────────────────────────────────────────────────────────────
# Security Stage
# ─────────────────────────────────────────────────────────────
secrets-scan:
  stage: security
  tags: [shell]
  script:
    - echo "Scanning for potential hardcoded secrets..."
    # SSH private keys
    - |
      if grep -rn "PRIVATE KEY" \
        --include="*.yaml" --include="*.yml" --include="*.sh" \
        . 2>/dev/null | grep -v ".git"; then
        echo "ERROR: Potential SSH private key found"
        exit 1
      fi
    # AWS keys
    - |
      if grep -rn "AKIA[A-Z0-9]\{16\}" \
        --include="*.yaml" --include="*.yml" --include="*.sh" \
        . 2>/dev/null | grep -v ".git"; then
        echo "ERROR: Potential AWS access key found"
        exit 1
      fi
    # Generic password patterns
    - |
      if grep -rn "password.*=.*['\"][^${}]" \
        --include="*.yaml" --include="*.yml" \
        . 2>/dev/null | grep -v ".git" \
        | grep -v "SOPS" | grep -v "placeholder" \
        | grep -v "example" | grep -v "CHANGE"; then
        echo "WARNING: Potential hardcoded password"
      fi
    - echo "Secrets scan completed"

# ─────────────────────────────────────────────────────────────
# Test Stage
# ─────────────────────────────────────────────────────────────
test-scripts:
  stage: test
  tags: [shell]
  script:
    - bash -n bootstrap.sh
    - bash -n pi-setup/pi-prep.sh
    - bash -n rancher/install-rancher.sh
    - bash -n scripts/install-zitadel.sh
    - |
      find scripts/ -name '*.sh' -type f | while read -r f; do
        echo "Syntax check: $f"
        bash -n "$f"
      done
    - echo "All script syntax checks passed"

test-bootstrap-dryrun:
  stage: test
  tags: [shell]
  script:
    - chmod +x bootstrap.sh
    - ./bootstrap.sh --help
    - ./bootstrap.sh --dry-run --platform pi --verbose

# ─────────────────────────────────────────────────────────────
# Companion-specific validation
# ─────────────────────────────────────────────────────────────
companion-config-parse:
  stage: validate
  tags: [shell]
  script:
    - cd apps/companion && python3 scripts/companion-deploy.py generate
    # Failure exits non-zero — catches YAML schema errors before deploy.

companion-config-substitute:
  stage: validate
  tags: [shell]
  script:
    # Run with placeholder env vars to confirm every ${VAR} reference
    # in connections.yaml is recognized. Adding a new ${VAR} without
    # updating this list will cause MISSING warnings here, prompting
    # the developer to add the env var to the SealedSecret + this list.
    - export PROPRESENTER_PASSWORD_YIBC=ci-dummy
    - export PROPRESENTER_PASSWORD_SAITAMA=ci-dummy
    - export OBS_PASSWORD_YIBC=ci-dummy
    - export OBS_PASSWORD_SAITAMA=ci-dummy
    - export SPOTIFY_CLIENT_ID=ci-dummy
    - export SPOTIFY_CLIENT_SECRET=ci-dummy
    - export SPOTIFY_CLIENT_ID_SAITAMA=ci-dummy
    - export SPOTIFY_CLIENT_SECRET_SAITAMA=ci-dummy
    - cd apps/companion && python3 scripts/companion-deploy.py generate 2>&1 | tee /tmp/sub-output.txt
    - |
      if grep -q "MISSING" /tmp/sub-output.txt; then
        echo "FAIL: Add the missing env vars to .gitlab-ci.yml"
        exit 1
      fi

companion-mixer-scenes-dryrun:
  stage: validate
  tags: [shell]
  script:
    # Validate every scene YAML by running mixer-state-deploy.py in
    # dry-run mode. No mixer connection — pure schema/parse validation.
    - |
      for scene in apps/companion/config/scenes/yibc/*.yaml apps/companion/config/scenes/saitama/*.yaml; do
        [ -f "$scene" ] || continue
        name=$(basename "$scene" .yaml)
        loc=$(basename "$(dirname "$scene")")
        echo "=== $loc/$name ==="
        python3 apps/companion/scripts/mixer-state-deploy.py --location "$loc" --scene "$name" --dry-run
      done

companion-seed-export:
  stage: validate
  tags: [shell]
  script:
    # Build per-site seed configs. Confirms filtering + host-rewrite
    # work without errors before handoff. Artifacts kept for download.
    - mkdir -p /tmp/seeds
    - python3 apps/companion/scripts/seed-export.py --site yibc --output /tmp/seeds/seed-yibc.companionconfig --rewrite-hosts
    - python3 apps/companion/scripts/seed-export.py --site saitama --output /tmp/seeds/seed-saitama.companionconfig --rewrite-hosts
    - ls -la /tmp/seeds/
  artifacts:
    paths:
      - /tmp/seeds/
    expire_in: 30 days

companion-kustomize-build:
  stage: validate
  tags: [shell]
  script:
    - kustomize build apps/companion >/dev/null
    - kustomize build apps/companion/overlays/dev >/dev/null
    - kustomize build apps/companion/overlays/prod >/dev/null

# ─────────────────────────────────────────────────────────────
# Dev environment deploy (manual, MR-pre-merge OK)
# ─────────────────────────────────────────────────────────────
# Mirrors the work-pattern: dev jobs runnable on MRs before approval,
# prod jobs gated post-merge. KUBECONFIG_DEV must be a CI/CD variable
# of type "File" pointing at a kubeconfig with apply permissions on
# the dev cluster.
dev-dryrun-apply:
  stage: dev
  tags: [shell]
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - kubectl --kubeconfig "$KUBECONFIG_DEV" apply --dry-run=server -k apps/companion/overlays/dev
  environment:
    name: dev
    url: https://companion.edge1.kubew.dev

dev-apply:
  stage: dev
  tags: [shell]
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - kubectl --kubeconfig "$KUBECONFIG_DEV" apply -k apps/companion/overlays/dev
  environment:
    name: dev
    url: https://companion.edge1.kubew.dev

# ─────────────────────────────────────────────────────────────
# Prod environment deploy (tag-gated, manual, post-merge only)
# ─────────────────────────────────────────────────────────────
# Only fires on commits tagged `prod-v*`. The tag itself must be
# GPG-signed (`git tag -s prod-vN`); the apply job re-verifies the
# signature server-side as last-line-of-defense.
prod-dryrun-apply:
  stage: prod
  tags: [shell]
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^prod-v/
  script:
    - kubectl --kubeconfig "$KUBECONFIG_PROD" apply --dry-run=server -k apps/companion/overlays/prod
  environment:
    name: prod
    url: https://companion.kubew.dev

prod-apply:
  stage: prod
  tags: [shell]
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^prod-v/
  script:
    - git verify-tag "$CI_COMMIT_TAG"
    - kubectl --kubeconfig "$KUBECONFIG_PROD" apply -k apps/companion/overlays/prod
  environment:
    name: prod
    url: https://companion.kubew.dev

# ─────────────────────────────────────────────────────────────
# Notify Stage — sends results to ntfy
# ─────────────────────────────────────────────────────────────
notify-success:
  stage: notify
  tags: [shell]
  when: on_success
  script:
    - |
      curl -sf -d "Pipeline #${CI_PIPELINE_IID} passed
      Branch: ${CI_COMMIT_REF_NAME}
      Commit: ${CI_COMMIT_SHORT_SHA} - ${CI_COMMIT_TITLE}" \
        -H "Title: CI Passed" \
        -H "Priority: default" \
        -H "Tags: white_check_mark" \
        "${NTFY_URL}" || true

notify-failure:
  stage: notify
  tags: [shell]
  when: on_failure
  script:
    - |
      curl -sf -d "Pipeline #${CI_PIPELINE_IID} FAILED
      Branch: ${CI_COMMIT_REF_NAME}
      Commit: ${CI_COMMIT_SHORT_SHA} - ${CI_COMMIT_TITLE}
      See: ${CI_PIPELINE_URL}" \
        -H "Title: CI FAILED" \
        -H "Priority: high" \
        -H "Tags: x" \
        "${NTFY_URL}" || true
