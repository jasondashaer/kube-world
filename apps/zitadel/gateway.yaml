# Zitadel HTTPRoute via Gateway API
# Routes external traffic to the Zitadel identity provider
#
# Zitadel must be accessible from:
#   - Browsers (SSO login flows)
#   - Other apps in the cluster (OIDC token validation)
#   - Edge cluster cattle-agents (via Tailscale → Traefik)
#
# Zitadel uses HTTP/2 (h2c) on port 8080 for both REST and gRPC.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: zitadel
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/part-of: kube-world
spec:
  parentRefs:
    - name: kube-world-gateway
      namespace: kube-system
  hostnames:
    - "auth.kubew.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zitadel
          port: 8080
