# Home Assistant configuration managed via GitOps.
# Mounted as /config/configuration.yaml via subPath (PVC holds .storage/ state).
# Changes here → git push → Flux syncs → Karmada propagates → pod restarts.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
data:
  configuration.yaml: |
    # Home identity and location — pre-configured to skip onboarding wizard.
    # Change these values and push to GitLab to update.
    homeassistant:
      name: "Home"
      latitude: 35.2271
      longitude: -80.8431
      elevation: 229
      unit_system: us_customary
      time_zone: "America/New_York"
      currency: "USD"
      country: "US"
      language: "en"
      external_url: "https://ha.edge1.kubew.dev"

    # Loads default set of integrations. Do not remove.
    default_config:

    # HTTP — reverse proxy support for Traefik
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16      # K3s pod CIDR
        - 10.43.0.0/16      # K3s service CIDR
        - 10.0.0.0/8        # LAN (covers any home network)
        - 100.64.0.0/10     # Tailscale CGNAT range
        - 127.0.0.1

    # Frontend themes
    frontend:
      themes: !include_dir_merge_named themes

    # SSO via native OIDC (hass-oidc-auth custom component)
    # Requires custom_components/auth_oidc/ installed on the PVC.
    auth_oidc:
      client_id: "HA_OIDC_CLIENT_ID"
      client_secret: "HA_OIDC_CLIENT_SECRET"
      discovery_url: "https://auth.DOMAIN/.well-known/openid-configuration"
      # Zitadel uses project audience scope for roles (not standard "groups" scope).
      # The claim-flattening action in Zitadel transforms the nested
      # urn:zitadel:iam:org:project:roles claim into a flat "groups" array.
      groups_scope: "urn:zitadel:iam:org:project:id:zitadel:aud"
      features:
        include_groups_scope: true
      roles:
        admin: "admin"
        user: "user"
      network:
        tls_verify: false

    # Include files for automations, scripts, scenes
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # Packages — organized config by area/function
    # homeassistant:
    #   packages: !include_dir_named packages/

  automations.yaml: "[]"
  scripts.yaml: ""
  scenes.yaml: "[]"

  # Patched injection.js for hass-oidc-auth component.
  # The upstream JS depends on HA-internal DOM elements that change between
  # versions. This simplified version injects a plain SSO button that works
  # on any HA version.
  injection.js: |
    (function() {
      const ssoName = window.sso_name || "Single Sign-On";
      let buttonAdded = false;

      function addSSOButton() {
        if (buttonAdded) return;

        const content = document.querySelector(".content");
        if (!content) return;

        const container = document.createElement("div");
        container.style.cssText = "text-align:center;margin:16px 0;";

        const btn = document.createElement("button");
        btn.textContent = "Log in with " + ssoName;
        btn.style.cssText = "background:#03a9f4;color:#fff;border:none;border-radius:4px;padding:12px 24px;font-size:16px;cursor:pointer;width:100%;max-width:300px;font-family:inherit;";
        btn.addEventListener("mouseover", function() { btn.style.background = "#0288d1"; });
        btn.addEventListener("mouseout", function() { btn.style.background = "#03a9f4"; });
        btn.addEventListener("click", function() {
          btn.textContent = "Redirecting...";
          btn.disabled = true;
          window.location.href = "/auth/oidc/redirect";
        });

        container.appendChild(btn);

        const sep = document.createElement("div");
        sep.style.cssText = "text-align:center;margin:12px 0;color:#888;font-size:14px;";
        sep.textContent = "\u2014 or \u2014";

        const header = content.querySelector(".header");
        if (header && header.nextSibling) {
          content.insertBefore(container, header.nextSibling);
          content.insertBefore(sep, container.nextSibling);
        } else {
          content.prepend(sep);
          content.prepend(container);
        }

        buttonAdded = true;
      }

      addSSOButton();
      const observer = new MutationObserver(addSSOButton);
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(addSSOButton, 500);
    })();
