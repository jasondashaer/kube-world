# Home Assistant Kubernetes Deployment
# Optimized for Raspberry Pi with IoT protocol support
---
apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
    workload-type: iot

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
    app.kubernetes.io/component: core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - iot
            - weight: 80
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - edge
            - weight: 50
              preference:
                matchExpressions:
                  - key: hardware
                    operator: In
                    values:
                      - raspberry-pi
                      - raspberry-pi-5

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      initContainers:
        # Install hass-oidc-auth custom component for Zitadel SSO.
        # Clones the component into the PVC, then patches injection.js
        # with our simplified version from the ConfigMap.
        - name: install-oidc-component
          image: docker.io/library/alpine:3.21
          command:
            - sh
            - -c
            - |
              apk add --no-cache git >/dev/null 2>&1
              COMP_DIR="/config/custom_components/auth_oidc"
              if [ ! -f "$COMP_DIR/manifest.json" ]; then
                echo "Installing hass-oidc-auth..."
                cd /tmp
                git clone --depth 1 https://github.com/christiaangoossens/hass-oidc-auth.git
                mkdir -p /config/custom_components
                cp -r hass-oidc-auth/custom_components/auth_oidc "$COMP_DIR"
                rm -rf hass-oidc-auth
              else
                echo "hass-oidc-auth already installed"
              fi
              echo "Patching injection.js..."
              cp /config-patches/injection.js "$COMP_DIR/static/injection.js"
              echo "Done"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-yaml
              mountPath: /config-patches/injection.js
              subPath: injection.js

      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2025.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: config
              mountPath: /config
            # GitOps-managed config files (subPath preserves PVC .storage/)
            - name: config-yaml
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
            - name: config-yaml
              mountPath: /config/automations.yaml
              subPath: automations.yaml
            - name: config-yaml
              mountPath: /config/scripts.yaml
              subPath: scripts.yaml
            - name: config-yaml
              mountPath: /config/scenes.yaml
              subPath: scenes.yaml
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: usb
              mountPath: /dev/bus/usb
            - name: ttyusb
              mountPath: /dev/ttyUSB0
            - name: ttyacm
              mountPath: /dev/ttyACM0
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: config-yaml
          configMap:
            name: home-assistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: usb
          hostPath:
            path: /dev/bus/usb
        - name: ttyusb
          hostPath:
            path: /dev/ttyUSB0
            type: ""
        - name: ttyacm
          hostPath:
            path: /dev/ttyACM0
            type: ""

      tolerations:
        - key: "iot-only"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: kube-world
spec:
  type: ClusterIP
  ports:
    - port: 8123
      targetPort: 8123
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: home-assistant
