# GitLab HTTPRoute via Gateway API
# Routes external traffic to native GitLab on port 8180
#
# Uses Gateway API instead of legacy Ingress for portability.
# To switch from Traefik to Istio later, change gatewayClassName
# on the shared Gateway resource — no changes needed here.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/part-of: kube-world
spec:
  parentRefs:
    - name: kube-world-gateway
      namespace: kube-system
  hostnames:
    - "gitlab.kubew.dev"
    - "gitlab.10.5.5.249.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab
          port: 80
