# ExternalDNS on pi-edge-1 — auto-creates Cloudflare DNS records
# from HTTPRoute resources on this cluster.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-edge1
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  kubeConfig:
    secretRef:
      name: pi-edge-1-kubeconfig
  targetNamespace: external-dns
  install:
    createNamespace: true
  values:
    provider:
      name: cloudflare
    sources:
      - gateway-httproute
    domainFilters:
      - edge1.kubew.dev
    txtOwnerId: pi-edge-1
    policy: sync
    interval: 1m
    registry: txt
    txtPrefix: "_externaldns."
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    logLevel: info
    logFormat: text
