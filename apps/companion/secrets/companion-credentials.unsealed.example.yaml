# EXAMPLE — DO NOT COMMIT THE FILLED VERSION OF THIS FILE.
#
# This is the cleartext template for the companion-credentials Secret.
# The procedure:
#   1. Copy this file to companion-credentials.unsealed.yaml (gitignored).
#   2. Fill in real values.
#   3. Encrypt with kubeseal:
#        kubeseal --controller-namespace sealed-secrets \
#          --controller-name sealed-secrets-controller \
#          -f companion-credentials.unsealed.yaml \
#          -w companion-credentials.sealed.yaml
#   4. Commit companion-credentials.sealed.yaml.
#   5. DELETE companion-credentials.unsealed.yaml from disk.
#   6. Flux applies the sealed CR. Controller decrypts to a real Secret.
#   7. Companion-deploy Pod reads via envFrom (see deploy-job.yaml).
#
# Per-cluster: each cluster (dev / prod) has its own controller keypair,
# so the same unsealed YAML must be re-sealed per cluster. Different
# sealed YAMLs for dev vs prod is intentional — dev creds shouldn't
# work in prod and vice versa.
---
apiVersion: v1
kind: Secret
metadata:
  name: companion-credentials
  namespace: companion
type: Opaque
stringData:
  # ProPresenter passwords (per location)
  PROPRESENTER_PASSWORD_YIBC: "YIBC"
  PROPRESENTER_PASSWORD_SAITAMA: "test1234"

  # OBS WebSocket passwords
  OBS_PASSWORD_YIBC: ""
  OBS_PASSWORD_SAITAMA: ""

  # Spotify developer-app credentials (one app per location/account)
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
  SPOTIFY_CLIENT_ID_SAITAMA: ""
  SPOTIFY_CLIENT_SECRET_SAITAMA: ""

  # Pro7 macro UUIDs (extracted from each PP instance after first connect)
  PRO7_CLOSING_GRAPHIC_MACRO_YIBC: ""
  PRO7_CLOSING_GRAPHIC_MACRO_SAITAMA: ""

  # Spotify playlist URIs (e.g. spotify:playlist:abcdef)
  SPOTIFY_PLAYLIST_URI_YIBC: ""
  SPOTIFY_PLAYLIST_URI_SAITAMA: ""
