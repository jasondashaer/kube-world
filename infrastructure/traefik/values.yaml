# Traefik Ingress Controller - Pi-optimized values
# Deployed via Helm in the kube-system namespace
#
# Uses LoadBalancer service type so K3s's built-in servicelb (klipper-lb)
# spawns svclb-traefik pods on the host network that bind host ports 80
# and 443. This is the correct way to expose standard HTTP/HTTPS ports
# on bare-metal K3s — hostPort alone doesn't work because K3s's default
# flannel CNI doesn't include the portmap plugin.
#
# Access paths once deployed:
#   http://<pi-ip>:80   — host port via klipper-lb svclb pod
#   https://<pi-ip>:443 — host port via klipper-lb svclb pod
#   http://<pi-ip>:30080 / 30443 — NodePort fallback
#
# Gateway API routes traffic by hostname (e.g., gitlab.kubew.dev)
# to the appropriate backend service.

# Resource constraints for Pi 5
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Single replica (single-node cluster)
deployment:
  replicas: 1

# Ports configuration.
# Note: do NOT set hostPort here. Even though K3s's flannel CNI ignores
# hostPort (so it's harmless at the CNI level), the K8s scheduler still
# tracks hostPort allocations on the node. Setting hostPort on the Traefik
# pod would prevent K3s's svclb-traefik pods (spawned by servicelb for
# the LoadBalancer service below) from binding the same host ports,
# leaving them Pending with "didn't have free ports" errors.
ports:
  traefik:
    port: 9000
    expose:
      default: false
  web:
    port: 8000
    expose:
      default: true
    nodePort: 30080
  websecure:
    port: 8443
    expose:
      default: true
    nodePort: 30443

# LoadBalancer service type — triggers K3s's built-in servicelb (klipper-lb)
# to spawn svclb-traefik-* pods on the host network that bind host ports
# 80/443. Without this, nothing is actually reachable via the standard
# HTTP/HTTPS ports on the node's IP.
service:
  type: LoadBalancer

# Access logs (lightweight)
logs:
  access:
    enabled: true
    format: json

# Dashboard (accessible via port-forward only)
ingressRoute:
  dashboard:
    enabled: false

# Providers
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: true

# Gateway API — Traefik auto-creates a GatewayClass.
# We manage our own Gateway resource in infrastructure/gateway/gateway.yaml
gateway:
  enabled: false
